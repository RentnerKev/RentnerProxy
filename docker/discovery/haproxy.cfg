# Optional isolated socket proxy. Bind only to a private Docker network; publish no host port.
# The appliance connects to http://<proxy-service>:2375 and never mounts the Docker socket.
# A :ro socket mount does not authorize API requests: the deny rules below are the boundary.
# Mount this config read-only and /var/run/docker.sock into the proxy only. Use HAProxy 3.2 LTS.
# Read capabilities: filtered container list, container inspect (includes private Docker metadata),
# and container/network events. Never expose this endpoint to untrusted containers or users.
global
    maxconn 32

defaults
    mode http
    timeout connect 3s
    timeout client 65s
    timeout server 65s

frontend discovery
    bind :2375
    acl read_method method GET
    acl discovery_path path_reg ^/v1\.47/(containers/json|containers/[a-f0-9]{64}/json|events)$
    http-request deny deny_status 403 unless read_method discovery_path
    default_backend docker

backend docker
    server engine /var/run/docker.sock
