name: Load runtime verification images
description: Verify and load exact same-run OCI artifacts without rebuilding.
inputs:
    platform:
        description: Expected Linux platform of the producer artifacts.
        required: false
        default: linux/amd64
    include_proxy_runtime:
        description: Load the producer's proxy-runtime artifact as well.
        required: false
        default: 'false'
    proxy_archive_sha256:
        description: Expected proxy-runtime OCI archive SHA-256 when included.
        required: false
    proxy_identity_sha256:
        description: Expected proxy-runtime identity SHA-256 when included.
        required: false
    scope:
        description: Producer run and attempt.
        required: true
    appliance_archive_sha256:
        description: Expected appliance OCI archive SHA-256.
        required: true
    appliance_identity_sha256:
        description: Expected appliance identity SHA-256.
        required: true
    http3_archive_sha256:
        description: Expected HTTP3 client OCI archive SHA-256.
        required: true
    http3_identity_sha256:
        description: Expected HTTP3 client identity SHA-256.
        required: true
runs:
    using: composite
    steps:
        - name: Download exact production OCI artifact
          uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
          with:
              name: runtime-appliance-${{ inputs.scope }}
              path: ${{ runner.temp }}/runtime-appliance

        - name: Download exact HTTP3 client OCI artifact
          uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
          with:
              name: runtime-http3-client-${{ inputs.scope }}
              path: ${{ runner.temp }}/runtime-http3-client

        - name: Install OCI transport
          shell: bash
          run: |
              sudo apt-get update
              sudo apt-get install --yes --no-install-recommends skopeo

        - name: Download exact proxy-runtime OCI artifact
          if: inputs.include_proxy_runtime == 'true'
          uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
          with:
              name: runtime-proxy-runtime-${{ inputs.scope }}
              path: ${{ runner.temp }}/runtime-proxy-runtime

        - name: Verify and load exact proxy-runtime image
          if: inputs.include_proxy_runtime == 'true'
          shell: bash
          env:
              RENTNERPROXY_SMOKE_REUSE_IMAGES: '1'
              RENTNERPROXY_SMOKE_RUN: ${{ inputs.scope }}
              RUNTIME_IMAGE_DIRECTORY: ${{ runner.temp }}/runtime-proxy-runtime
              RUNTIME_IMAGE_KIND: proxy-runtime
              RUNTIME_IMAGE_PLATFORM: ${{ inputs.platform }}
              RUNTIME_IMAGE_ARCHIVE_SHA256: ${{ inputs.proxy_archive_sha256 }}
              RUNTIME_IMAGE_IDENTITY_SHA256: ${{ inputs.proxy_identity_sha256 }}
          run: bun --no-env-file .github/scripts/ci/runtime-image-artifact.ts load

        - name: Verify and load exact production image
          shell: bash
          env:
              RENTNERPROXY_SMOKE_REUSE_IMAGES: '1'
              RENTNERPROXY_SMOKE_RUN: ${{ inputs.scope }}
              RUNTIME_IMAGE_DIRECTORY: ${{ runner.temp }}/runtime-appliance
              RUNTIME_IMAGE_KIND: appliance
              RUNTIME_IMAGE_PLATFORM: ${{ inputs.platform }}
              RUNTIME_IMAGE_ARCHIVE_SHA256: ${{ inputs.appliance_archive_sha256 }}
              RUNTIME_IMAGE_IDENTITY_SHA256: ${{ inputs.appliance_identity_sha256 }}
          run: bun --no-env-file .github/scripts/ci/runtime-image-artifact.ts load

        - name: Verify and load exact HTTP3 client image
          shell: bash
          env:
              RENTNERPROXY_SMOKE_REUSE_IMAGES: '1'
              RENTNERPROXY_SMOKE_RUN: ${{ inputs.scope }}
              RUNTIME_IMAGE_DIRECTORY: ${{ runner.temp }}/runtime-http3-client
              RUNTIME_IMAGE_KIND: http3-client
              RUNTIME_IMAGE_PLATFORM: ${{ inputs.platform }}
              RUNTIME_IMAGE_ARCHIVE_SHA256: ${{ inputs.http3_archive_sha256 }}
              RUNTIME_IMAGE_IDENTITY_SHA256: ${{ inputs.http3_identity_sha256 }}
          run: bun --no-env-file .github/scripts/ci/runtime-image-artifact.ts load
