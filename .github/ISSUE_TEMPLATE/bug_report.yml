name: 🐛 Bug Report
description: Report a reproducible problem in RentnerProxy.
labels:
    - bug
body:
    - type: markdown
      attributes:
          value: |
              Thanks for helping improve RentnerProxy.

              Do not report security vulnerabilities in a public issue. Use [GitHub Private Vulnerability Reporting](https://github.com/RentnerKev/RentnerProxy/security/advisories/new) instead.

              Never include passwords, API keys, controller tokens, private keys, certificate private material, database credentials, or other private data.

    - type: input
      id: summary
      attributes:
          label: Summary
          description: Describe the problem and its impact in one or two sentences.
          placeholder: A concise description of the problem.
      validations:
          required: true

    - type: input
      id: version
      attributes:
          label: Version
          description: Provide the release, preview, development version, or commit you tested.
          placeholder: e.g. v0.3.0, dev, pr-142, or a commit SHA
      validations:
          required: true

    - type: dropdown
      id: deployment
      attributes:
          label: Deployment type
          description: How is the affected RentnerProxy instance running?
          options:
              - Stable Docker image
              - Dev/pre-release image
              - PR preview image
              - Local development
              - Other
      validations:
          required: true

    - type: dropdown
      id: component
      attributes:
          label: Affected component
          description: Select the area most directly affected by the problem.
          options:
              - Web / Admin UI
              - Authentication / Accounts
              - Proxy Hosts
              - OpenResty Runtime
              - Certificates
              - ACME
              - Upstream TLS
              - Database
              - Redis
              - Docker / Deployment
              - CI / GitHub Automation
              - Other
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
          description: What did you expect to happen?
      validations:
          required: true

    - type: textarea
      id: actual
      attributes:
          label: Actual behavior
          description: What happened instead?
      validations:
          required: true

    - type: textarea
      id: reproduction
      attributes:
          label: Reproduction steps
          description: Provide the smallest set of steps that reliably reproduces the problem.
          placeholder: |
              1. Start RentnerProxy with ...
              2. Open ...
              3. Observe ...
      validations:
          required: true

    - type: textarea
      id: logs
      attributes:
          label: Relevant logs
          description: Remove passwords, API keys, controller tokens, private keys, certificate private material, database credentials, and other private data before posting logs.
          render: shell

    - type: input
      id: browser
      attributes:
          label: Browser
          description: If the problem affects the web interface, provide the browser and version.
          placeholder: e.g. Firefox 142 or Chrome 140

    - type: textarea
      id: environment
      attributes:
          label: Operating system / environment
          description: Include the operating system, architecture, and other relevant environment details.
          placeholder: |
              - OS: Ubuntu 24.04
              - Architecture: amd64
              - Relevant infrastructure: reverse proxy, firewall, or network details

    - type: textarea
      id: context
      attributes:
          label: Additional context
          description: Add any other information, screenshots, or links that may help.

    - type: checkboxes
      id: confirmation
      attributes:
          label: Confirmation
          options:
              - label: I searched existing issues for the same problem.
                required: true
              - label: I am not reporting a security vulnerability publicly.
                required: true
              - label: I removed secrets, credentials, private keys, certificate private material, production data, and other private information.
                required: true
