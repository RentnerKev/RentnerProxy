name: ✨ Feature Request
description: Suggest an improvement or new capability for RentnerProxy.
labels:
    - enhancement
body:
    - type: markdown
      attributes:
          value: |
              Please describe the underlying problem before proposing implementation details. Large architectural changes should be discussed before implementation.

    - type: textarea
      id: motivation
      attributes:
          label: Problem / motivation
          description: What concrete problem or use case should this feature address?
      validations:
          required: true

    - type: textarea
      id: solution
      attributes:
          label: Proposed solution
          description: What behavior or outcome are you proposing?
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: Which alternatives or workarounds have you considered?

    - type: dropdown
      id: area
      attributes:
          label: Affected area
          description: Select the area most directly related to the request.
          options:
              - Web / Admin UI
              - Authentication / Accounts
              - Proxy Hosts
              - OpenResty Runtime
              - Certificates / ACME / TLS
              - Database / Redis
              - Docker / Deployment
              - CI / GitHub Automation
              - Documentation
              - Other
      validations:
          required: true

    - type: textarea
      id: context
      attributes:
          label: Additional context
          description: Add any other information, mockups, or links that may help.

    - type: dropdown
      id: contribution
      attributes:
          label: Willingness to contribute
          description: How would you like to help with this request?
          options:
              - I can implement this
              - I can help test this
              - I can provide feedback
              - I am only suggesting the idea

    - type: checkboxes
      id: confirmation
      attributes:
          label: Confirmation
          options:
              - label: I searched existing issues for the same request.
                required: true
              - label: This request describes a concrete use case.
                required: true
