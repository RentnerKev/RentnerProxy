name: PR Title

on:
    pull_request:
        branches:
            - main
        types:
            - opened
            - edited
            - reopened
            - synchronize
            - ready_for_review

permissions:
    pull-requests: read

concurrency:
    group: pr-title-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    pr-title:
        name: PR Title
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Validate Conventional Commit title
              env:
                  EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
                  GITHUB_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
              shell: bash
              run: |
                  set -Eeuo pipefail
                  pattern='^(feat|fix|refactor|perf|test|docs|build|ci|chore|style|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: [^[:space:]].*$'
                  pr_title="$EVENT_PR_TITLE"

                  if [[ -z "$pr_title" ]]; then
                    if [[ "$GITHUB_REF" =~ ^refs/pull/([1-9][0-9]*)/merge$ ]]; then
                      pr_number="${BASH_REMATCH[1]}"
                    else
                      echo '::error::Could not resolve pull request number.'
                      exit 1
                    fi
                    pr_title="$(
                      curl --fail --location --proto '=https' --silent --show-error --tlsv1.2 \
                        --header 'Accept: application/vnd.github+json' \
                        --header "Authorization: Bearer $GITHUB_TOKEN" \
                        --header 'X-GitHub-Api-Version: 2022-11-28' \
                        "$GITHUB_API_URL/repos/$REPOSITORY/pulls/$pr_number" |
                        jq --exit-status --raw-output '.title | strings | select(length > 0)'
                    )"
                  fi

                  if [[ ! "$pr_title" =~ $pattern ]]; then
                    echo "Pull request title must follow Conventional Commits."
                    echo "Expected: type(scope): description or type: description"
                    echo "Allowed types: feat, fix, refactor, perf, test, docs, build, ci, chore, style, revert"
                    exit 1
                  fi

            - name: Capture exact tested merge SHA
              env:
                  TESTED_SHA: ${{ github.sha }}
              shell: bash
              run: |
                  set -Eeuo pipefail
                  [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
                      echo '::error::GitHub did not provide a valid tested merge SHA.'
                      exit 1
                  }
                  proof_directory="$RUNNER_TEMP/pr-preview-source"
                  mkdir -p "$proof_directory"
                  printf '%s\n' "$TESTED_SHA" > "$proof_directory/tested-sha.txt"

            - name: Upload exact tested merge SHA
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  compression-level: 0
                  if-no-files-found: error
                  name: pr-preview-source
                  path: ${{ runner.temp }}/pr-preview-source/tested-sha.txt
                  retention-days: 2
