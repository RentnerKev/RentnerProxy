name: PR Title

on:
    pull_request:
        branches:
            - main
        types:
            - opened
            - edited
            - reopened
            - synchronize
            - ready_for_review

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: pr-title-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    pr-title:
        name: PR Title
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check out trusted title automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: trusted
                  ref: ${{ github.event.pull_request.base.sha }}

            - name: Validate Conventional Commit title
              env:
                  EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
                  GITHUB_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
              shell: bash
              run: bash trusted/.github/scripts/ci/validate-pr-title.sh

            - name: Capture exact pull request and tested merge SHA
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  TESTED_SHA: ${{ github.sha }}
              shell: bash
              run: bash trusted/.github/scripts/ci/capture-preview-source.sh

            - name: Upload exact pull request and tested merge SHA
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  compression-level: 0
                  if-no-files-found: error
                  name: pr-preview-source
                  path: |
                      ${{ runner.temp }}/pr-preview-source/pr-number.txt
                      ${{ runner.temp }}/pr-preview-source/tested-sha.txt
                  retention-days: 2
