name: Runtime Reliability

on:
    pull_request:
        paths:
            - '.github/workflows/runtime-reliability.yml'
            - '.github/scripts/**'
            - 'core/**'
            - 'docker/**'
            - 'docker-compose.yml'
            - 'scripts/**'
            - 'web/**'
            - '.dockerignore'
            - 'package.json'
            - 'bun.lock'
            - 'bunfig.toml'
            - 'drizzle.config.ts'
            - 'vite.config.ts'
            - 'tsconfig*.json'
    push:
        branches:
            - main
        paths:
            - '.github/workflows/runtime-reliability.yml'
            - '.github/scripts/**'
            - 'core/**'
            - 'docker/**'
            - 'docker-compose.yml'
            - 'scripts/**'
            - 'web/**'
            - '.dockerignore'
            - 'package.json'
            - 'bun.lock'
            - 'bunfig.toml'
            - 'drizzle.config.ts'
            - 'vite.config.ts'
            - 'tsconfig*.json'
    workflow_dispatch:
        inputs:
            profile:
                description: Bounded profile (long is explicit release preparation)
                required: true
                default: short
                type: choice
                options:
                    - short
                    - long
            duration-seconds:
                description: Optional duration bound (30 to 7200 seconds)
                type: string
            iterations:
                description: Optional iteration bound (1 to 1000)
                type: string
            concurrency:
                description: Optional bounded concurrency (1 to 8)
                type: string
            capture-resources:
                description: Capture resource samples
                default: true
                type: boolean
            seed:
                description: Optional deterministic uint32 seed
                type: string

permissions:
    contents: read

concurrency:
    group: runtime-reliability-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
    BUN_VERSION: 1.4.4
    DOCKER_BUILD_SUMMARY: 'false'
    DOCKER_BUILD_RECORD_UPLOAD: 'false'
    RENTNERPROXY_SMOKE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
    runtime-reliability:
        name: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'short' }} / current
        runs-on: ubuntu-latest
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs['duration-seconds'] != '' && 240 || 90 }}
        steps:
            - name: Prepare sanitized failure report
              run: |
                  mkdir -p "$RUNNER_TEMP/runtime-reliability-report"
                  printf '%s\n' '{"summary":{"passed":false,"requestedDurationReached":false},"failure":"runner-not-completed"}' > "$RUNNER_TEMP/runtime-reliability-report/report.json"

            - name: Check out exact target commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Set up Bun
              id: bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Prepare exact committed build context
              run: |
                  mkdir -p "$RUNNER_TEMP/runtime-reliability-source"
                  git archive HEAD | tar -x -C "$RUNNER_TEMP/runtime-reliability-source"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
              with:
                  buildkitd-config-inline: |
                      [worker.oci]
                        max-parallelism = 2

            - name: Build and load exact runtime image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: ${{ runner.temp }}/runtime-reliability-source
                  file: ${{ runner.temp }}/runtime-reliability-source/docker/production/Dockerfile
                  load: true
                  push: false
                  tags: rentnerproxy-reliability-${{ env.RENTNERPROXY_SMOKE_RUN }}:current
                  labels: |
                      org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
                      io.rentnerproxy.smoke-run=${{ env.RENTNERPROXY_SMOKE_RUN }}
                  cache-from: |
                      type=gha,version=2,scope=runtime-reliability-appliance-v1,timeout=2m
                      type=gha,version=2,scope=production-smokes-appliance-v1,timeout=2m
                  cache-to: type=gha,version=2,scope=runtime-reliability-appliance-v1,mode=max,timeout=2m,ignore-error=true

            - name: Run isolated runtime reliability fixture
              env:
                  PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'short' }}
                  DURATION_SECONDS: ${{ inputs['duration-seconds'] }}
                  ITERATIONS: ${{ inputs.iterations }}
                  CONCURRENCY: ${{ inputs.concurrency }}
                  CAPTURE_RESOURCES: ${{ github.event_name != 'workflow_dispatch' || inputs['capture-resources'] }}
                  SEED: ${{ inputs.seed }}
              run: |
                  args=(--profile "$PROFILE" --image "rentnerproxy-reliability-${RENTNERPROXY_SMOKE_RUN}:current" --capture-resources "$CAPTURE_RESOURCES" --report "$RUNNER_TEMP/runtime-reliability-report/report.json")
                  if [ -n "$DURATION_SECONDS" ]; then args+=(--duration-seconds "$DURATION_SECONDS"); fi
                  if [ -n "$ITERATIONS" ]; then args+=(--iterations "$ITERATIONS"); fi
                  if [ -n "$CONCURRENCY" ]; then args+=(--concurrency "$CONCURRENCY"); fi
                  if [ -n "$SEED" ]; then args+=(--seed "$SEED"); fi
                  bun --no-env-file --no-orphans scripts/runtime-reliability/run.ts "${args[@]}"

            - name: Remove this run's private Docker resources
              if: always() && steps.bun.outcome == 'success'
              run: bun --no-env-file .github/scripts/ci/production-smoke-ci.ts cleanup

            - name: Upload sanitized JSON evidence
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: runtime-reliability-current-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/runtime-reliability-report/report.json
                  if-no-files-found: error
                  retention-days: 30
