name: Release Compatibility

on:
    pull_request:
        branches:
            - main
        paths:
            - '.github/workflows/release-compatibility.yml'
            - 'controller/**'
            - 'docker/**'
            - 'docker-compose.yml'
            - 'scripts/**'
            - 'tests/production/**'
            - 'web/drizzle/**'
            - 'web/src/db/**'
            - 'web/src/features/**'
            - 'web/src/routes/**'
            - 'web/src/server/**'
            - 'web/src/config/**'
            - 'web/src/shared/**'
            - 'web/src/start.ts'
            - 'web/src/websockets/**'
            - 'web/vite.config.ts'
            - 'package.json'
            - 'bun.lock'
    push:
        branches:
            - main
        paths:
            - 'scripts/production-backup*'
            - 'scripts/production-restore.ts'
            - 'scripts/release-compatibility/**'
            - 'docker/web/bootstrap-secrets.mjs'
            - 'docker/web/validate-backup.mjs'
    schedule:
        - cron: '17 3 * * 1'
    workflow_dispatch:
        inputs:
            source:
                description: Published source image or the complete release matrix
                required: true
                default: all
                type: choice
                options:
                    - all
                    - fresh
                    - alpha.1
                    - alpha.2
                    - alpha.3
                    - alpha.4
                    - alpha.5
                    - alpha.6

permissions:
    contents: read

concurrency:
    group: release-compatibility-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    BUN_VERSION: 1.4.2
    RENTNERPROXY_SMOKE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
    select-sources:
        runs-on: ubuntu-latest
        outputs:
            sources: ${{ steps.select.outputs.sources }}
        steps:
            - id: select
              name: Select immutable source releases
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  REQUESTED_SOURCE: ${{ inputs.source }}
              run: |
                  if [ "$EVENT_NAME" = push ]; then
                    sources='["alpha.4","alpha.5","alpha.6"]'
                  elif [ "$EVENT_NAME" = pull_request ]; then
                    sources='["fresh","alpha.6"]'
                  elif [ "$EVENT_NAME" = schedule ] || [ "$REQUESTED_SOURCE" = all ]; then
                    sources='["fresh","alpha.1","alpha.2","alpha.3","alpha.4","alpha.5","alpha.6"]'
                  else
                    sources="[\"$REQUESTED_SOURCE\"]"
                  fi
                  echo "sources=$sources" >> "$GITHUB_OUTPUT"

    release-compatibility:
        needs: select-sources
        strategy:
            fail-fast: false
            max-parallel: 3
            matrix:
                source: ${{ fromJSON(needs.select-sources.outputs.sources) }}
        name: ${{ matrix.source }} to target
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - name: Check out target commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run published-image upgrade compatibility
              run: bun --no-orphans scripts/release-compatibility/run.ts '${{ matrix.source }}'
