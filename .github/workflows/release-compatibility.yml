name: Release Compatibility

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            source:
                description: Source image (all verifies the complete supported source matrix)
                required: true
                default: all
                type: choice
                options:
                    - all
                    - fresh
                    - oldest
                    - previous

permissions:
    contents: read

concurrency:
    group: release-compatibility-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'push' }}

env:
    BUN_VERSION: 1.4.4
    RENTNERPROXY_SMOKE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
    select-sources:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            sources: ${{ steps.select.outputs.sources }}
            complete: ${{ steps.select.outputs.complete }}
        steps:
            - name: Check out target history
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  ref: ${{ github.sha }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - id: select
              name: Select immutable source releases
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  REQUESTED_SOURCE: ${{ inputs.source }}
                  GH_TOKEN: ${{ github.token }}
              run: bun --no-env-file .github/scripts/ci/release-compatibility/select-sources.ts

    build-runtime-images:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        outputs:
            scope: ${{ steps.images.outputs.scope }}
            appliance_archive_sha256: ${{ steps.images.outputs.appliance_archive_sha256 }}
            appliance_identity_sha256: ${{ steps.images.outputs.appliance_identity_sha256 }}
            http3_archive_sha256: ${{ steps.images.outputs.http3_archive_sha256 }}
            http3_identity_sha256: ${{ steps.images.outputs.http3_identity_sha256 }}
        steps:
            - name: Check out target commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ github.sha }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Build and export runtime images
              id: images
              uses: ./.github/actions/runtime-images

    release-compatibility:
        needs: [select-sources, build-runtime-images]
        env:
            RENTNERPROXY_SMOKE_REUSE_IMAGES: '1'
            RENTNERPROXY_SMOKE_RUN: ${{ needs.build-runtime-images.outputs.scope }}
        strategy:
            fail-fast: false
            max-parallel: 3
            matrix:
                source: ${{ fromJSON(needs.select-sources.outputs.sources) }}
        name: ${{ matrix.source.role }} to target
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - name: Check out target commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  ref: ${{ github.sha }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Load verified runtime images
              uses: ./.github/actions/load-runtime-images
              with:
                  scope: ${{ needs.build-runtime-images.outputs.scope }}
                  appliance_archive_sha256: ${{ needs.build-runtime-images.outputs.appliance_archive_sha256 }}
                  appliance_identity_sha256: ${{ needs.build-runtime-images.outputs.appliance_identity_sha256 }}
                  http3_archive_sha256: ${{ needs.build-runtime-images.outputs.http3_archive_sha256 }}
                  http3_identity_sha256: ${{ needs.build-runtime-images.outputs.http3_identity_sha256 }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run published-image upgrade compatibility
              env:
                  COMPATIBILITY_SOURCE: ${{ toJSON(matrix.source) }}
                  GH_TOKEN: ${{ github.token }}
              run: bun --no-env-file --no-orphans .github/scripts/ci/release-compatibility/run.ts

    compatibility-verified:
        name: Compatibility verified
        needs: [select-sources, build-runtime-images, release-compatibility]
        if: ${{ always() }}
        runs-on: ubuntu-latest
        timeout-minutes: 1
        steps:
            - name: Require complete successful compatibility matrix
              env:
                  SELECTION_RESULT: ${{ needs.select-sources.result }}
                  BUILD_RESULT: ${{ needs.build-runtime-images.result }}
                  MATRIX_RESULT: ${{ needs.release-compatibility.result }}
                  COMPLETE: ${{ needs.select-sources.outputs.complete }}
              run: test "$SELECTION_RESULT" = success && test "$BUILD_RESULT" = success && test "$MATRIX_RESULT" = success && test "$COMPLETE" = true
