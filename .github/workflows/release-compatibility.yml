name: Release Compatibility

on:
    pull_request:
        paths:
            - '.github/workflows/release-compatibility.yml'
            - '.github/scripts/**'
            - 'scripts/**'
            - 'core/**'
            - 'web/**'
            - 'docker/**'
            - '.dockerignore'
            - 'docker-compose.yml'
            - 'package.json'
            - 'bun.lock'
            - 'bunfig.toml'
            - 'drizzle.config.ts'
            - 'vite.config.ts'
            - 'tsconfig*.json'
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            source:
                description: Source image (all verifies the complete supported source matrix)
                required: true
                default: all
                type: choice
                options:
                    - all
                    - fresh
                    - oldest
                    - previous

permissions:
    contents: read

concurrency:
    group: release-compatibility-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    BUN_VERSION: 1.4.4
    RENTNERPROXY_SMOKE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
    select-sources:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            sources: ${{ steps.select.outputs.sources }}
            complete: ${{ steps.select.outputs.complete }}
        steps:
            - name: Check out target history
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - id: select
              name: Select immutable source releases
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  REQUESTED_SOURCE: ${{ inputs.source }}
                  GH_TOKEN: ${{ github.token }}
              run: bun --no-env-file .github/scripts/ci/release-compatibility/select-sources.ts

    release-compatibility:
        needs: select-sources
        strategy:
            fail-fast: false
            max-parallel: 3
            matrix:
                source: ${{ fromJSON(needs.select-sources.outputs.sources) }}
        name: ${{ matrix.source.role }} to target
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - name: Check out target commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run published-image upgrade compatibility
              env:
                  COMPATIBILITY_SOURCE: ${{ toJSON(matrix.source) }}
                  GH_TOKEN: ${{ github.token }}
              run: bun --no-env-file --no-orphans .github/scripts/ci/release-compatibility/run.ts

    compatibility-verified:
        name: Compatibility verified
        needs: [select-sources, release-compatibility]
        if: ${{ always() }}
        runs-on: ubuntu-latest
        timeout-minutes: 1
        steps:
            - name: Require complete successful compatibility matrix
              env:
                  SELECTION_RESULT: ${{ needs.select-sources.result }}
                  MATRIX_RESULT: ${{ needs.release-compatibility.result }}
                  COMPLETE: ${{ needs.select-sources.outputs.complete }}
              run: test "$SELECTION_RESULT" = success && test "$MATRIX_RESULT" = success && test "$COMPLETE" = true
