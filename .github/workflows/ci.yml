name: CI

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    BUN_VERSION: 1.4.4
    RUST_VERSION: 1.99.1

jobs:
    format:
        name: Format
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Set up Rust
              run: |
                  rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
                  rustup override set "$RUST_VERSION"

            - name: Restore Bun dependency cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check formatting
              run: bun --no-env-file run format:check

    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Restore Bun dependency cache
              id: bun-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run Oxlint
              run: bun --no-env-file run lint

            - name: Save Bun dependency cache
              if: github.event_name != 'pull_request' && steps.bun-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}

    typecheck:
        name: Script Typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Restore Bun dependency cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check script TypeScript
              run: bun --no-env-file run typecheck:scripts

    web-tests:
        name: Web Tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            postgres:
                image: mirror.gcr.io/library/postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
                env:
                    POSTGRES_USER: rentnerproxy
                    POSTGRES_PASSWORD: rentnerproxy
                    POSTGRES_DB: rentnerproxy_upstream_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U rentnerproxy -d rentnerproxy_upstream_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
            valkey:
                image: mirror.gcr.io/valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "valkey-cli ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: postgresql://rentnerproxy:rentnerproxy@127.0.0.1:5432/rentnerproxy_upstream_test
            VALKEY_URL: redis://127.0.0.1:6379
            RENTNERPROXY_DATABASE_INTEGRATION: '1'
            RENTNERPROXY_VALKEY_INTEGRATION: '1'
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Restore Bun dependency cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check database migrations
              run: bun --no-env-file run db:check

            - name: Apply database migrations
              run: bun --no-env-file run db:migrate

            - name: Run web tests
              run: bun --no-env-file run test:ts

            - name: Run database integration tests
              run: bun --no-env-file run test:db

            - name: Create isolated host page fixture database
              run: psql "$DATABASE_URL" --no-psqlrc -v ON_ERROR_STOP=1 -c 'CREATE DATABASE host_page_fixture;'

            - name: Run host page storage integration tests
              env:
                  DATABASE_URL: postgresql://rentnerproxy:rentnerproxy@127.0.0.1:5432/host_page_fixture
                  RENTNERPROXY_HOST_PAGE_FIXTURE: '1'
              run: bun --no-env-file test --isolate ./web/src/tests/server/Admin/HostTags/host-page-storage.db.test.ts

    fuzz:
        name: Fuzz Tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Restore Bun dependency cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run fuzz and property-based tests
              run: bun --no-env-file run test:fuzz

    rust:
        name: Rust
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Rust
              run: |
                  rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component llvm-tools-preview
                  rustup override set "$RUST_VERSION"

            - name: Restore Cargo dependency cache
              id: cargo-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/registry/src
                      ~/.cargo/git/db
                  key: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('core/Cargo.lock') }}

            - name: Run Clippy
              run: cargo clippy --locked --manifest-path core/Cargo.toml --all-targets --all-features -- -D warnings

            - name: Install Rust coverage tool
              run: cargo install cargo-llvm-cov --locked --version 0.9.1

            - name: Run Rust tests with coverage
              id: rust-tests
              run: cargo llvm-cov --locked --manifest-path core/Cargo.toml --all-features --no-report

            - name: Run Rust documentation tests
              run: cargo test --locked --manifest-path core/Cargo.toml --doc

            - name: Report and check Rust coverage
              id: rust-coverage
              if: ${{ !cancelled() && steps.rust-tests.outcome != 'skipped' }}
              run: bash .github/scripts/ci/rust-coverage.sh

            - name: Store Linux Rust coverage
              if: ${{ !cancelled() && steps.rust-coverage.outcome != 'skipped' }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: rust-coverage-linux
                  path: core/target/coverage
                  if-no-files-found: error
                  retention-days: 14

            - name: Save Cargo dependency cache
              if: github.event_name != 'pull_request' && steps.cargo-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/registry/src
                      ~/.cargo/git/db
                  key: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('core/Cargo.lock') }}

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Set up Rust
              run: |
                  rustup toolchain install "$RUST_VERSION" --profile minimal
                  rustup override set "$RUST_VERSION"

            - name: Restore Bun dependency cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}

            - name: Restore Cargo dependency cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/registry/src
                      ~/.cargo/git/db
                  key: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('core/Cargo.lock') }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build production artifacts
              run: bun --no-env-file run build

    caddy-response-cache:
        name: Caddy Response Cache
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Verify module checksums, race safety and formatting
              run: |
                  docker run --rm --workdir /src \
                    --mount "type=bind,source=$GITHUB_WORKSPACE/core/caddy-modules/responsecache,target=/src,readonly" \
                    --env GOTOOLCHAIN=local --env CGO_ENABLED=1 \
                    mirror.gcr.io/library/golang:1.27.2-trixie@sha256:47667934874913a449b96faa7ef4777fa285d9ec29126ee80ed61c45b7cccf0e \
                    /bin/sh -ec 'go mod download; go mod verify; go test -mod=readonly -race -count=1 ./...; go vet -mod=readonly ./...; test -z "$(gofmt -l .)"'

            - name: Build actual custom Caddy
              run: docker build --file docker/proxy-runtime/Dockerfile --target caddy-build --tag response-cache-caddy:test .

            - name: Verify counting upstream, security ordering, variants and ephemeral lifecycle
              run: |
                  docker run --rm --entrypoint /bin/sh --workdir /src \
                    --mount "type=bind,source=$GITHUB_WORKSPACE/core/caddy-modules/responsecache,target=/src,readonly" \
                    --env RENTNERPROXY_CADDY_TEST_BINARY=/usr/bin/caddy \
                    response-cache-caddy:test \
                    -ec 'go test -mod=readonly -run TestCaddyRuntime -count=1 -v ./...'
