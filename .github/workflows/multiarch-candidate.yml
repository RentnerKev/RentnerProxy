name: Assessed Multiarch Candidate
on:
    workflow_dispatch:
permissions:
    contents: read
    actions: read
jobs:
    probe:
        name: Probe ${{ matrix.target }} ${{ matrix.runner }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 40
        strategy:
            fail-fast: false
            matrix:
                target: [debian, fedora]
                architecture: [amd64, arm64]
                include:
                    - architecture: amd64
                      runner: ubuntu-latest
                    - architecture: arm64
                      runner: ubuntu-24.04-arm
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
              with:
                  bun-version: 1.4.4
            - name: Install disposable host tools
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends skopeo systemd-container
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: 41932448192
                  name: assessed-candidate-41932448192
                  path: ${{ runner.temp }}/candidate
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: 41932448192
                  name: distribution-candidate-41932448192
                  path: ${{ runner.temp }}/distribution
            - name: Test complete package lifecycle against the assessed image
              env:
                  TARGET: ${{ matrix.target }}
                  ARCHITECTURE: ${{ matrix.architecture }}
                  SOURCE_DIRECTORY: ${{ github.workspace }}
                  CANDIDATE_DIRECTORY: ${{ runner.temp }}/candidate
                  DISTRIBUTION_DIRECTORY: ${{ runner.temp }}/distribution
              run: |
                  export REVISION=$(jq -r .revision "$DISTRIBUTION_DIRECTORY/bundle.json") VERSION=v1.0.0-beta.9999
                  export EXPECTED_DIGEST=$(jq -r .digest "$DISTRIBUTION_DIRECTORY/bundle.json")
                  bun --no-env-file build .github/scripts/ci/distribution/native-probe.ts --target=bun --outfile="$DISTRIBUTION_DIRECTORY/native-probe.js"
                  bun --no-env-file -e 'import {readFile,rm} from "node:fs/promises"; import {join} from "node:path"; import {writeDistributionBundle} from "./.github/scripts/distribution/bundle.ts"; const root=process.env.DISTRIBUTION_DIRECTORY; const {revision,version,digest,runId,runAttempt}=JSON.parse(await readFile(join(root,"bundle.json"),"utf8")); await rm(join(root,"bundle.json")); await writeDistributionBundle(root,{revision,version,digest,runId,runAttempt})'
                  export ARCHIVE_SHA256=$(sha256sum "$CANDIDATE_DIRECTORY/candidate-image.tar" | cut -d ' ' -f1)
                  export BUNDLE_SHA256=$(sha256sum "$DISTRIBUTION_DIRECTORY/bundle.json" | cut -d ' ' -f1)
                  export GITHUB_RUN_ID=41932448192 GITHUB_RUN_ATTEMPT=1
                  bash .github/scripts/ci/distribution/native-host.sh
