name: Assessed Multiarch Candidate

on:
    pull_request:
        paths:
            - '.github/workflows/build-assessed-*.yml'
            - '.github/workflows/publish-assessed-image.yml'
            - '.github/workflows/multiarch-candidate.yml'
            - '.github/workflows/release-pipeline.yml'
            - '.github/workflows/build-distribution.yml'
            - '.github/workflows/publish-distribution.yml'
            - '.github/workflows/sign-distribution.yml'
            - '.github/scripts/distribution/**'
            - '.github/scripts/ci/distribution/**'
            - 'packaging/**'
            - 'docker/production/**'
            - 'docker/tooling/distribution/**'
            - 'scripts/backup/**'
            - 'scripts/production-backup.ts'
            - 'scripts/production-restore.ts'
            - '.github/scripts/release/**'
            - '.github/scripts/security/**'
            - '.github/scripts/lib/oci-layout.ts'
            - '.github/scripts/lib/Types/oci-layout.types.ts'
            - '.github/scripts/ci/platform-backup*'
            - 'scripts/compatibility/**'
            - 'web/src/lib/ApplicationVersion/imagePlatform.ts'
            - 'web/src/server/Updates/**'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: assessed-multiarch-candidate-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    candidate:
        if: github.repository == 'RentnerProxy/platform'
        uses: ./.github/workflows/build-assessed-image.yml
        permissions:
            contents: read
        with:
            revision: ${{ github.sha }}
            image: ghcr.io/rentnerkev/rentnerproxy
            version: v1.0.0-beta.9999
            title: RentnerProxy assessed multi-architecture candidate
            description: Native validation candidate for the exact tested source.
            cache_scope: multiarch-review

    distribution:
        needs: candidate
        permissions:
            contents: read
        uses: ./.github/workflows/build-distribution.yml
        with:
            revision: ${{ github.sha }}
            version: v1.0.0-beta.9999
            digest: ${{ needs.candidate.outputs.digest }}
            archive_sha256: ${{ needs.candidate.outputs.archive_sha256 }}
            evidence_sha256: ${{ needs.candidate.outputs.evidence_sha256 }}
