name: Assessed Multiarch Candidate
on:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    probe:
        name: Probe ${{ matrix.target }} ${{ matrix.runner }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 12
        strategy:
            fail-fast: false
            matrix:
                target: [debian, fedora]
                runner: [ubuntu-latest, ubuntu-24.04-arm]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - name: Boot disposable systemd target and run rootful Podman
              env:
                  TARGET: ${{ matrix.target }}
              run: bash .github/scripts/ci/distribution/boot-probe.sh
