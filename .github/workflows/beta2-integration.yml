name: Beta 2 Integration

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: beta2-integration-${{ github.ref }}
    cancel-in-progress: true

jobs:
    beta2:
        name: Cross-language Beta 2 journeys
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            postgres:
                image: mirror.gcr.io/library/postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
                env:
                    POSTGRES_USER: rentnerproxy
                    POSTGRES_PASSWORD: rentnerproxy
                    POSTGRES_DB: rentnerproxy_beta2_test
                ports: [5432:5432]
                options: >-
                    --health-cmd "pg_isready -U rentnerproxy -d rentnerproxy_beta2_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
            valkey:
                image: mirror.gcr.io/valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
                ports: [6379:6379]
                options: >-
                    --health-cmd "valkey-cli ping"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            BUN_VERSION: 1.4.4
            RUST_VERSION: 1.99.1
            DATABASE_URL: postgresql://rentnerproxy:rentnerproxy@127.0.0.1:5432/rentnerproxy_beta2_test
            VALKEY_URL: redis://127.0.0.1:6379
            RENTNERPROXY_BETA2_INTEGRATION: '1'
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Set up Rust
              run: |
                  rustup toolchain install "$RUST_VERSION" --profile minimal
                  rustup override set "$RUST_VERSION"
            - name: Restore Bun dependency cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
            - name: Restore Cargo dependency cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/registry/src
                      ~/.cargo/git/db
                  key: ${{ runner.os }}-cargo-${{ env.RUST_VERSION }}-${{ hashFiles('core/Cargo.lock') }}
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Extract pinned Caddy fixture binary
              shell: bash
              run: |
                  set -euo pipefail
                  export RENTNERPROXY_TEST_CADDY_BIN="$RUNNER_TEMP/beta2-caddy"
                  printf '%s\n' "RENTNERPROXY_TEST_CADDY_BIN=$RENTNERPROXY_TEST_CADDY_BIN" >> "$GITHUB_ENV"
                  image=mirror.gcr.io/library/caddy:2.11.7@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
                  container=$(docker create "$image")
                  trap 'docker rm -f "$container" >/dev/null' EXIT
                  docker cp "$container:/usr/bin/caddy" "$RENTNERPROXY_TEST_CADDY_BIN"
                  chmod 700 "$RENTNERPROXY_TEST_CADDY_BIN"
                  "$RENTNERPROXY_TEST_CADDY_BIN" version
            - name: Migrate isolated fixture database
              run: bun --no-env-file run db:migrate
            - name: Run real Beta 2 journeys
              run: bun --no-env-file .github/scripts/ci/beta2/run.ts
