name: Production Smokes

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: production-smokes-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    RENTNERPROXY_SMOKE_REUSE_IMAGES: '1'
    BUN_VERSION: 1.4.4
    DOCKER_BUILD_SUMMARY: 'false'
    DOCKER_BUILD_RECORD_UPLOAD: 'false'
    RENTNERPROXY_SMOKE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
    production-smokes:
        name: Production Smokes
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Bun
              id: bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Docker discovery socket proxy restrictions
              run: bun --no-env-file --no-orphans scripts/smoke/docker-discovery.ts

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build and load proxy-runtime smoke image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: docker/proxy-runtime/Dockerfile
                  load: true
                  push: false
                  tags: rentnerproxy-smoke-${{ env.RENTNERPROXY_SMOKE_RUN }}:proxy-runtime
                  labels: |
                      io.rentnerproxy.smoke-run=${{ env.RENTNERPROXY_SMOKE_RUN }}
                      io.rentnerproxy.smoke-source=${{ github.sha }}
                      io.rentnerproxy.smoke-image=proxy-runtime
                  cache-from: type=gha,version=2,scope=production-smokes-proxy-runtime-v1,timeout=2m
                  cache-to: type=gha,version=2,scope=production-smokes-proxy-runtime-v1,mode=max,timeout=2m,ignore-error=true

            - name: Build and load appliance smoke image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: docker/production/Dockerfile
                  load: true
                  push: false
                  tags: rentnerproxy-smoke-${{ env.RENTNERPROXY_SMOKE_RUN }}:appliance
                  labels: |
                      io.rentnerproxy.smoke-run=${{ env.RENTNERPROXY_SMOKE_RUN }}
                      io.rentnerproxy.smoke-source=${{ github.sha }}
                      io.rentnerproxy.smoke-image=appliance
                  cache-from: type=gha,version=2,scope=production-smokes-appliance-v1,timeout=2m
                  cache-to: type=gha,version=2,scope=production-smokes-appliance-v1,mode=max,timeout=2m,ignore-error=true

            - name: Build and load http3-client smoke image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: scripts/smoke/http3/Dockerfile
                  load: true
                  push: false
                  tags: rentnerproxy-smoke-${{ env.RENTNERPROXY_SMOKE_RUN }}:http3-client
                  labels: |
                      io.rentnerproxy.smoke-run=${{ env.RENTNERPROXY_SMOKE_RUN }}
                      io.rentnerproxy.smoke-source=${{ github.sha }}
                      io.rentnerproxy.smoke-image=http3-client
                  cache-from: type=gha,version=2,scope=production-smokes-http3-client-v1,timeout=2m
                  cache-to: type=gha,version=2,scope=production-smokes-http3-client-v1,mode=max,timeout=2m,ignore-error=true

            - name: Verify images for this run
              run: bun --no-env-file --no-orphans .github/scripts/ci/production-smoke-ci.ts verify-images

            - name: Proxy runtime
              run: bun --no-env-file --no-orphans .github/scripts/ci/production-smoke-ci.ts proxy

            - name: Production appliance, backup and restore
              run: bun --no-env-file --no-orphans .github/scripts/ci/production-smoke-ci.ts production

            - name: Production appliance request draining
              run: bun --no-env-file --no-orphans .github/scripts/ci/appliance-drain-smoke.ts

            - name: Certificates and ACME
              run: bun --no-env-file --no-orphans .github/scripts/ci/production-smoke-ci.ts certificates

            - name: Upstream TLS
              run: bun --no-env-file --no-orphans .github/scripts/ci/production-smoke-ci.ts upstream-tls

            - name: Clean up this run and summarize
              if: always() && steps.bun.outcome == 'success'
              run: bun --no-env-file .github/scripts/ci/production-smoke-ci.ts cleanup
