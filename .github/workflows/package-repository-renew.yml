name: Renew signed package metadata

on:
    schedule:
        - cron: '23 4 * * 1'
    workflow_dispatch:

permissions: {}

concurrency:
    group: signed-package-repository
    cancel-in-progress: false

jobs:
    history:
        if: github.repository == 'RentnerProxy/RentnerProxy' && github.ref == 'refs/heads/main'
        name: Check whether signed publication has been initialized
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            exists: ${{ steps.history.outputs.exists }}
        steps:
            - name: Probe public data branch without credentials
              id: history
              run: |
                  status=0
                  remote=$(git ls-remote --exit-code https://github.com/RentnerProxy/RentnerProxy.git refs/heads/package-repository) || status=$?
                  if [[ "$status" == 2 ]]; then
                      printf 'exists=false\n' >> "$GITHUB_OUTPUT"
                  elif [[ "$status" == 0 && "$remote" =~ ^[a-f0-9]{40}[[:space:]]refs/heads/package-repository$ ]]; then
                      printf 'exists=true\n' >> "$GITHUB_OUTPUT"
                  else
                      exit 1
                  fi

    refresh:
        needs: history
        if: needs.history.outputs.exists == 'true'
        name: Renew metadata from immutable signed history
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: package-signing
        permissions:
            contents: write
        outputs:
            fingerprint: ${{ steps.identity.outputs.fingerprint }}
            repository_url: ${{ steps.identity.outputs.repository_url }}
        steps:
            - name: Check out trusted metadata automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: automation
                  ref: ${{ github.workflow_sha }}
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.4
            - name: Install trusted metadata tools
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends apt-utils createrepo-c gnupg rpm
            - name: Read public repository data
              env:
                  AUTOMATION_DIRECTORY: ${{ github.workspace }}/automation
                  REPOSITORY_DIRECTORY: ${{ runner.temp }}/package-repository
              run: bash automation/.github/scripts/distribution/read-repository.sh
            - name: Verify signed history and renew expiring metadata
              env:
                  PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
                  PACKAGE_SIGNING_FINGERPRINT: ${{ vars.PACKAGE_SIGNING_FINGERPRINT }}
                  PACKAGE_PREVIOUS_FINGERPRINTS: ${{ vars.PACKAGE_PREVIOUS_FINGERPRINTS }}
                  PACKAGE_REPOSITORY_URL: ${{ vars.PACKAGE_REPOSITORY_URL || 'https://rentnerproxy.github.io/RentnerProxy' }}
                  SOURCE_DIRECTORY: ${{ github.workspace }}/automation
                  PUBLIC_DIRECTORY: ${{ runner.temp }}/package-repository/public
              run: bun --no-env-file automation/.github/scripts/distribution/publication.ts refresh
            - name: Retain renewed metadata atomically
              env:
                  AUTOMATION_DIRECTORY: ${{ github.workspace }}/automation
                  REPOSITORY_DIRECTORY: ${{ runner.temp }}/package-repository
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: bash automation/.github/scripts/distribution/push-repository.sh
            - name: Expose public repository identity
              id: identity
              env:
                  FINGERPRINT: ${{ vars.PACKAGE_SIGNING_FINGERPRINT }}
                  REPOSITORY_URL: ${{ vars.PACKAGE_REPOSITORY_URL || 'https://rentnerproxy.github.io/RentnerProxy' }}
              run: |
                  [[ "$FINGERPRINT" =~ ^[A-F0-9]{40}$ ]]
                  printf 'fingerprint=%s\nrepository_url=%s\n' "$FINGERPRINT" "$REPOSITORY_URL" >> "$GITHUB_OUTPUT"
            - name: Prepare verified public snapshot
              uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
              with:
                  path: ${{ runner.temp }}/package-repository/public

    deploy:
        needs: refresh
        name: Deploy renewed signed metadata
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy public snapshot
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

    consumer:
        needs: [refresh, deploy]
        name: Verify renewed ${{ matrix.target }} consumer metadata
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                target: [debian, fedora]
        permissions:
            contents: read
        steps:
            - name: Check out trusted consumer verification
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ github.workflow_sha }}
            - name: Build clean native package consumer
              env:
                  TARGET: ${{ matrix.target }}
              run: docker build --file "docker/tooling/distribution/Dockerfile.$TARGET" --tag rp-package-consumer:fixture .
            - name: Set up native verification runtime
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.4
            - name: Verify published signatures without authentication
              env:
                  TARGET: ${{ matrix.target }}
                  PACKAGE_SIGNING_FINGERPRINT: ${{ needs.refresh.outputs.fingerprint }}
                  PACKAGE_REPOSITORY_URL: ${{ needs.refresh.outputs.repository_url }}
              run: docker run --rm --env TARGET --env PACKAGE_REPOSITORY_URL --env PACKAGE_SIGNING_FINGERPRINT --mount "type=bind,source=$GITHUB_WORKSPACE,target=/automation,readonly" --mount "type=bind,source=$(command -v bun),target=/usr/local/bin/bun,readonly" --entrypoint bash rp-package-consumer:fixture /automation/.github/scripts/distribution/published-consumer.sh
