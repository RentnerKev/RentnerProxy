name: Dev Image

on:
    workflow_dispatch:

permissions: {}

concurrency:
    group: dev-image
    cancel-in-progress: false

jobs:
    build:
        name: Build and assess :dev
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        outputs:
            revision: ${{ steps.source.outputs.revision }}
            image: ${{ steps.source.outputs.image }}
            digest: ${{ steps.scan.outputs.digest }}
            archive_sha256: ${{ steps.archive.outputs.sha256 }}
        steps:
            - name: Require main
              shell: bash
              run: |
                  if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
                      echo '::error::The dev image can only be built from main.'
                      exit 1
                  fi

            - name: Check out trusted image automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: automation
                  ref: ${{ github.workflow_sha }}

            - name: Check out current main
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: source
                  ref: refs/heads/main

            - name: Verify source and generate dev identity
              id: source
              shell: bash
              run: bash source/.github/scripts/deploy/dev-image-source.sh

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

            - name: Generate image metadata
              id: metadata
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  flavor: latest=false
                  images: ${{ steps.source.outputs.image }}
                  labels: |
                      org.opencontainers.image.title=RentnerProxy Dev
                      org.opencontainers.image.description=Test image built from the current main branch; not a release.
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.url=https://github.com/${{ github.repository }}
                      org.opencontainers.image.version=${{ steps.source.outputs.version }}
                      org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
                      org.opencontainers.image.licenses=MIT
                  tags: |
                      type=raw,value=dev

            - name: Build dev image as isolated OCI data
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  cache-from: type=gha,scope=dev
                  cache-to: type=gha,mode=max,scope=dev
                  build-args: RENTNERPROXY_BUILD_VERSION=${{ steps.source.outputs.version }}
                  context: source
                  file: source/docker/production/Dockerfile
                  labels: ${{ steps.metadata.outputs.labels }}
                  platforms: linux/amd64
                  provenance: mode=max
                  push: false
                  outputs: type=oci,dest=${{ runner.temp }}/candidate-image.tar
                  sbom: true

            - name: Set up Bun for advisory policy
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.2

            - name: Audit locked source graphs
              env:
                  AUTOMATION_DIRECTORY: automation
                  SOURCE_DIRECTORY: source
                  REPORT_DIRECTORY: ${{ runner.temp }}/dependency-source-report
                  REVISION: ${{ steps.source.outputs.revision }}
              run: |
                  bash automation/.github/scripts/security/audit-cargo.sh
                  cd source
                  bun audit --audit-level=moderate

            - name: Install pinned vulnerability tools
              run: bash automation/.github/scripts/security/install-dependency-tools.sh

            - name: Assess immutable candidate before publication
              id: scan
              env:
                  AUTOMATION_DIRECTORY: automation
                  IMAGE_SOURCE: oci-archive:${{ runner.temp }}/candidate-image.tar
                  REPORT_DIRECTORY: ${{ runner.temp }}/dependency-image-report
                  REVISION: ${{ steps.source.outputs.revision }}
              run: bash automation/.github/scripts/security/scan-image.sh

            - name: Bind archive checksum
              id: archive
              run: printf 'sha256=%s\n' "$(sha256sum "$RUNNER_TEMP/candidate-image.tar" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

            - name: Store assessed OCI candidate
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  compression-level: 0
                  if-no-files-found: error
                  overwrite: true
                  name: assessed-candidate-${{ github.run_id }}
                  path: ${{ runner.temp }}/candidate-image.tar
                  retention-days: 2

            - name: Store dependency evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  if-no-files-found: error
                  name: dependency-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      ${{ runner.temp }}/dependency-source-report
                      ${{ runner.temp }}/dependency-image-report
                  retention-days: 30

    publish-image:
        needs:
            - build
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/publish-assessed-image.yml
        with:
            revision: ${{ needs.build.outputs.revision }}
            image: ${{ needs.build.outputs.image }}
            archive_sha256: ${{ needs.build.outputs.archive_sha256 }}
            digest: ${{ needs.build.outputs.digest }}
            image_tags: dev
