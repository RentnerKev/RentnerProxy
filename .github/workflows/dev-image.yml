name: Dev Image

on:
    workflow_dispatch:

permissions: {}

concurrency:
    group: dev-image
    cancel-in-progress: false

jobs:
    prepare:
        name: Prepare dev identity
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        outputs:
            revision: ${{ steps.source.outputs.revision }}
            image: ${{ steps.source.outputs.image }}
            version: ${{ steps.source.outputs.version }}
        steps:
            - name: Require main
              shell: bash
              run: |
                  if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
                      echo '::error::The dev image can only be built from main.'
                      exit 1
                  fi

            - name: Check out trusted image automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: automation
                  ref: ${{ github.workflow_sha }}

            - name: Check out current main
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: source
                  ref: refs/heads/main

            - name: Verify source and generate dev identity
              id: source
              shell: bash
              run: bash source/.github/scripts/deploy/dev-image-source.sh

    build:
        needs: prepare
        permissions:
            contents: read
        uses: ./.github/workflows/build-assessed-image.yml
        with:
            revision: ${{ needs.prepare.outputs.revision }}
            image: ${{ needs.prepare.outputs.image }}
            version: ${{ needs.prepare.outputs.version }}
            title: RentnerProxy Dev
            description: Test image built from the current main branch; not a release.
            cache_scope: dev

    publish-image:
        needs:
            - prepare
            - build
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/publish-assessed-image.yml
        with:
            revision: ${{ needs.prepare.outputs.revision }}
            image: ${{ needs.prepare.outputs.image }}
            archive_sha256: ${{ needs.build.outputs.archive_sha256 }}
            digest: ${{ needs.build.outputs.digest }}
            image_tags: dev
