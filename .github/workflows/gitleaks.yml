name: Gitleaks

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: gitleaks-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    GITLEAKS_VERSION: 8.30.1
    GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
    gitleaks:
        name: Gitleaks
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Check out trusted secret-scanning automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: trusted
                  ref: ${{ github.event.pull_request.base.sha || github.sha }}

            - name: Install Gitleaks
              shell: bash
              run: bash trusted/.github/scripts/security/install-gitleaks.sh

            - name: Scan commits
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PUSH_BEFORE_SHA: ${{ github.event.before }}
                  PUSH_AFTER_SHA: ${{ github.event.after }}
              shell: bash
              run: bash trusted/.github/scripts/security/scan-commits.sh
