name: PR Preview Publish

on:
    workflow_run:
        workflows:
            - PR Preview Build
        types:
            - completed

permissions: {}

env:
    BUN_VERSION: 1.4.3
    GATE_TIMEOUT_SECONDS: 1500
    POLL_INTERVAL_SECONDS: 20

jobs:
    resolve:
        name: PR Preview / Verify trusted handoff
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'workflow_run'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            actions: read
            checks: read
            contents: read
            pull-requests: read
        outputs:
            base_ref: ${{ steps.resolve.outputs.base_ref }}
            base_sha: ${{ steps.resolve.outputs.base_sha }}
            head_repository: ${{ steps.resolve.outputs.head_repository }}
            head_sha: ${{ steps.resolve.outputs.head_sha }}
            image: ${{ steps.resolve.outputs.image }}
            immutable_reference: ${{ steps.resolve.outputs.immutable_reference }}
            immutable_tag: ${{ steps.resolve.outputs.immutable_tag }}
            lifecycle: ${{ steps.resolve.outputs.lifecycle }}
            moving_reference: ${{ steps.resolve.outputs.moving_reference }}
            moving_tag: ${{ steps.resolve.outputs.moving_tag }}
            pr_number: ${{ steps.resolve.outputs.pr_number }}
            repository: ${{ steps.resolve.outputs.repository }}
            run_attempt: ${{ steps.resolve.outputs.run_attempt }}
            run_id: ${{ steps.resolve.outputs.run_id }}
            tested_sha: ${{ steps.resolve.outputs.tested_sha }}
            trigger_run_id: ${{ steps.resolve.outputs.trigger_run_id }}
        steps:
            - name: Check out trusted preview automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: trusted
                  persist-credentials: false
                  ref: ${{ github.workflow_sha }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Verify source workflow and artifact envelope
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
              run: bun --no-env-file trusted/.github/scripts/deploy/pr-preview.ts preflight

            - name: Download exact handoff artifact for resolution
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  github-token: ${{ github.token }}
                  name: pr-preview-image
                  path: ${{ runner.temp }}/pr-preview-resolve
                  repository: ${{ github.repository }}
                  run-id: ${{ github.event.workflow_run.id }}

            - name: Read validated handoff identity
              id: handoff
              env:
                  ARTIFACT_DIRECTORY: ${{ runner.temp }}/pr-preview-resolve
                  GITHUB_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
              run: bun --no-env-file trusted/.github/scripts/deploy/pr-preview.ts artifact-identity

            - name: Verify PR trigger and SHA-proof artifact envelope
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  SOURCE_RUN_ID: ${{ steps.handoff.outputs.trigger_run_id }}
              run: bun --no-env-file trusted/.github/scripts/deploy/pr-preview.ts trigger-preflight

            - name: Download exact tested merge SHA
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  github-token: ${{ github.token }}
                  name: pr-preview-source
                  path: ${{ runner.temp }}/pr-preview-source
                  repository: ${{ github.repository }}
                  run-id: ${{ steps.handoff.outputs.trigger_run_id }}

            - name: Resolve PR and recheck required checks
              id: resolve
              env:
                  ARTIFACT_DIRECTORY: ${{ runner.temp }}/pr-preview-resolve
                  GITHUB_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  SOURCE_PROOF_DIRECTORY: ${{ runner.temp }}/pr-preview-source
                  SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
              run: bun --no-env-file trusted/.github/scripts/deploy/pr-preview.ts resolve

    publish:
        name: PR Preview / Publish image
        if: needs.resolve.outputs.lifecycle == 'open'
        needs:
            - resolve
        runs-on: ubuntu-latest
        timeout-minutes: 45
        concurrency:
            group: pr-preview-publish-${{ needs.resolve.outputs.pr_number }}
            cancel-in-progress: false
        permissions:
            actions: read
            checks: read
            contents: read
            packages: write
            pull-requests: read
        outputs:
            digest: ${{ steps.publish.outputs.digest }}
        steps:
            - name: Check out trusted preview automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: trusted
                  persist-credentials: false
                  ref: ${{ github.workflow_sha }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Download exact OCI artifact
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  github-token: ${{ github.token }}
                  name: pr-preview-image
                  path: ${{ runner.temp }}/pr-preview-artifact
                  repository: ${{ github.repository }}
                  run-id: ${{ github.event.workflow_run.id }}

            - name: Install trusted OCI tooling
              shell: bash
              run: |
                  set -Eeuo pipefail
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends skopeo
                  skopeo --version

            - name: Validate artifact and OCI metadata
              id: artifact
              env:
                  ARTIFACT_DIRECTORY: ${{ runner.temp }}/pr-preview-artifact
                  IMMUTABLE_TAG: ${{ needs.resolve.outputs.immutable_tag }}
                  PR_BASE_REF: ${{ needs.resolve.outputs.base_ref }}
                  PR_BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
                  PR_HEAD_REPOSITORY: ${{ needs.resolve.outputs.head_repository }}
                  PR_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
                  PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
                  REPOSITORY: ${{ needs.resolve.outputs.repository }}
                  SOURCE_RUN_ATTEMPT: ${{ needs.resolve.outputs.run_attempt }}
                  SOURCE_RUN_ID: ${{ needs.resolve.outputs.run_id }}
                  SOURCE_TRIGGER_RUN_ID: ${{ needs.resolve.outputs.trigger_run_id }}
                  TESTED_SHA: ${{ needs.resolve.outputs.tested_sha }}
              shell: bash
              run: bash trusted/.github/scripts/deploy/validate-preview-image.sh

            - name: Install trusted dependency scanners
              run: bash trusted/.github/scripts/security/install-dependency-tools.sh

            - name: Assess exact validated preview image before publication
              env:
                  AUTOMATION_DIRECTORY: ${{ github.workspace }}/trusted
                  IMAGE_SOURCE: oci-archive:${{ runner.temp }}/pr-preview-artifact/preview-image.tar
                  REPORT_DIRECTORY: ${{ runner.temp }}/dependency-preview-report
                  REVISION: ${{ needs.resolve.outputs.tested_sha }}
              run: bash trusted/.github/scripts/security/scan-image.sh

            - name: Publish immutable and moving preview tags
              id: publish
              env:
                  ARTIFACT_DIRECTORY: ${{ runner.temp }}/pr-preview-artifact
                  ASSESSED_REPORT: ${{ runner.temp }}/dependency-preview-report/assessment.json
                  GHCR_TOKEN: ${{ github.token }}
                  GHCR_USERNAME: ${{ github.actor }}
                  GITHUB_TOKEN: ${{ github.token }}
                  IMAGE: ${{ needs.resolve.outputs.image }}
                  IMMUTABLE_REFERENCE: ${{ needs.resolve.outputs.immutable_reference }}
                  IMMUTABLE_TAG: ${{ needs.resolve.outputs.immutable_tag }}
                  MOVING_REFERENCE: ${{ needs.resolve.outputs.moving_reference }}
                  MOVING_TAG: ${{ needs.resolve.outputs.moving_tag }}
                  PR_BASE_REF: ${{ needs.resolve.outputs.base_ref }}
                  PR_BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
                  PR_HEAD_REPOSITORY: ${{ needs.resolve.outputs.head_repository }}
                  PR_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
                  PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
                  REPOSITORY: ${{ needs.resolve.outputs.repository }}
                  SOURCE_IMAGE_DIGEST: ${{ steps.artifact.outputs.source_digest }}
                  TESTED_SHA: ${{ needs.resolve.outputs.tested_sha }}
              shell: bash
              run: bash trusted/.github/scripts/deploy/publish-preview-image.sh

            - name: Store exact-preview advisory evidence
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  if-no-files-found: warn
                  name: dependency-preview-evidence-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/dependency-preview-report
                  retention-days: 30

            - name: Remove registry credentials
              if: always()
              shell: bash
              run: |
                  auth_file="$RUNNER_TEMP/pr-preview-auth/auth.json"
                  if [[ -f "$auth_file" ]]; then
                      skopeo logout --authfile "$auth_file" ghcr.io || true
                      rm -f "$auth_file"
                  fi

    comment:
        name: PR Preview / Update PR comment
        if: needs.resolve.outputs.lifecycle == 'open'
        needs:
            - resolve
            - publish
        runs-on: ubuntu-latest
        timeout-minutes: 10
        concurrency:
            group: pr-preview-comment-${{ needs.resolve.outputs.pr_number }}
            cancel-in-progress: false
        permissions:
            actions: read
            checks: read
            contents: read
            pull-requests: write
        steps:
            - name: Check out trusted preview automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: trusted
                  persist-credentials: false
                  ref: ${{ github.workflow_sha }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Revalidate PR and update marker comment
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
                  PR_BASE_REF: ${{ needs.resolve.outputs.base_ref }}
                  PR_BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
                  PR_HEAD_REPOSITORY: ${{ needs.resolve.outputs.head_repository }}
                  PR_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
                  PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
                  REPOSITORY: ${{ needs.resolve.outputs.repository }}
                  TESTED_SHA: ${{ needs.resolve.outputs.tested_sha }}
              run: bun --no-env-file trusted/.github/scripts/deploy/pr-preview.ts comment
