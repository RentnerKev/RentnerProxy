name: PR Preview Publish

on:
    workflow_run:
        workflows:
            - PR Preview Build
        types:
            - completed

permissions: {}

env:
    BUN_VERSION: 1.4.0
    GATE_TIMEOUT_SECONDS: 1500
    POLL_INTERVAL_SECONDS: 20

jobs:
    resolve:
        name: PR Preview / Verify trusted handoff
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'workflow_run'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            actions: read
            checks: read
            contents: read
            pull-requests: read
        outputs:
            base_ref: ${{ steps.resolve.outputs.base_ref }}
            base_sha: ${{ steps.resolve.outputs.base_sha }}
            head_repository: ${{ steps.resolve.outputs.head_repository }}
            head_sha: ${{ steps.resolve.outputs.head_sha }}
            image: ${{ steps.resolve.outputs.image }}
            immutable_reference: ${{ steps.resolve.outputs.immutable_reference }}
            immutable_tag: ${{ steps.resolve.outputs.immutable_tag }}
            moving_reference: ${{ steps.resolve.outputs.moving_reference }}
            moving_tag: ${{ steps.resolve.outputs.moving_tag }}
            pr_number: ${{ steps.resolve.outputs.pr_number }}
            repository: ${{ steps.resolve.outputs.repository }}
            run_attempt: ${{ steps.resolve.outputs.run_attempt }}
            run_id: ${{ steps.resolve.outputs.run_id }}
            tested_sha: ${{ steps.resolve.outputs.tested_sha }}
            trigger_run_id: ${{ steps.resolve.outputs.trigger_run_id }}
        steps:
            - name: Check out trusted preview automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: trusted
                  persist-credentials: false
                  ref: ${{ github.workflow_sha }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Verify source workflow and artifact envelope
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
              run: bun trusted/scripts/pr-preview.ts preflight

            - name: Download exact handoff artifact for resolution
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  github-token: ${{ github.token }}
                  name: pr-preview-image
                  path: ${{ runner.temp }}/pr-preview-resolve
                  repository: ${{ github.repository }}
                  run-id: ${{ github.event.workflow_run.id }}

            - name: Read validated handoff identity
              id: handoff
              env:
                  ARTIFACT_DIRECTORY: ${{ runner.temp }}/pr-preview-resolve
                  GITHUB_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
              run: bun trusted/scripts/pr-preview.ts artifact-identity

            - name: Verify PR trigger and SHA-proof artifact envelope
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  SOURCE_RUN_ID: ${{ steps.handoff.outputs.trigger_run_id }}
              run: bun trusted/scripts/pr-preview.ts trigger-preflight

            - name: Download exact tested merge SHA
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  github-token: ${{ github.token }}
                  name: pr-preview-source
                  path: ${{ runner.temp }}/pr-preview-source
                  repository: ${{ github.repository }}
                  run-id: ${{ steps.handoff.outputs.trigger_run_id }}

            - name: Resolve PR and recheck required checks
              id: resolve
              env:
                  ARTIFACT_DIRECTORY: ${{ runner.temp }}/pr-preview-resolve
                  GITHUB_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  SOURCE_PROOF_DIRECTORY: ${{ runner.temp }}/pr-preview-source
                  SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
              run: bun trusted/scripts/pr-preview.ts resolve

    publish:
        name: PR Preview / Publish image
        needs:
            - resolve
        runs-on: ubuntu-latest
        timeout-minutes: 10
        concurrency:
            group: pr-preview-publish-${{ needs.resolve.outputs.pr_number }}
            cancel-in-progress: false
        permissions:
            actions: read
            checks: read
            contents: read
            packages: write
            pull-requests: read
        outputs:
            digest: ${{ steps.publish.outputs.digest }}
        steps:
            - name: Check out trusted preview automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: trusted
                  persist-credentials: false
                  ref: ${{ github.workflow_sha }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Download exact OCI artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  github-token: ${{ github.token }}
                  name: pr-preview-image
                  path: ${{ runner.temp }}/pr-preview-artifact
                  repository: ${{ github.repository }}
                  run-id: ${{ github.event.workflow_run.id }}

            - name: Install trusted OCI tooling
              shell: bash
              run: |
                  set -Eeuo pipefail
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends skopeo
                  skopeo --version

            - name: Validate artifact and OCI metadata
              env:
                  ARTIFACT_DIRECTORY: ${{ runner.temp }}/pr-preview-artifact
                  IMMUTABLE_TAG: ${{ needs.resolve.outputs.immutable_tag }}
                  PR_BASE_REF: ${{ needs.resolve.outputs.base_ref }}
                  PR_BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
                  PR_HEAD_REPOSITORY: ${{ needs.resolve.outputs.head_repository }}
                  PR_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
                  PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
                  REPOSITORY: ${{ needs.resolve.outputs.repository }}
                  SOURCE_RUN_ATTEMPT: ${{ needs.resolve.outputs.run_attempt }}
                  SOURCE_RUN_ID: ${{ needs.resolve.outputs.run_id }}
                  SOURCE_TRIGGER_RUN_ID: ${{ needs.resolve.outputs.trigger_run_id }}
                  TESTED_SHA: ${{ needs.resolve.outputs.tested_sha }}
              shell: bash
              run: |
                  set -Eeuo pipefail
                  oci_archive="$ARTIFACT_DIRECTORY/preview-image.tar"
                  bun trusted/scripts/pr-preview.ts validate-artifact

                  raw_manifest="$(skopeo inspect --raw "oci-archive:$oci_archive")"
                  media_type="$(jq --raw-output '.mediaType // empty' <<< "$raw_manifest")"
                  case "$media_type" in
                      application/vnd.oci.image.manifest.v1+json)
                          ;;
                      application/vnd.oci.image.index.v1+json)
                          jq --exit-status \
                              '(.manifests | length) == 1 and
                               .manifests[0].mediaType == "application/vnd.oci.image.manifest.v1+json" and
                               .manifests[0].platform.os == "linux" and
                               .manifests[0].platform.architecture == "amd64" and
                               ((.manifests[0].platform.variant // "") == "")' \
                              <<< "$raw_manifest" > /dev/null || {
                                  echo '::error::OCI index must contain exactly one linux/amd64 image.'
                                  exit 1
                              }
                          ;;
                      *)
                          echo '::error::Artifact is not an OCI image manifest or index.'
                          exit 1
                          ;;
                  esac

                  config="$(skopeo inspect --config "oci-archive:$oci_archive")"
                  jq --exit-status \
                      --arg revision "$TESTED_SHA" \
                      --arg source "https://github.com/$REPOSITORY" \
                      --arg title 'RentnerProxy PR Preview' \
                      --arg version "$IMMUTABLE_TAG" \
                      '.os == "linux" and
                       .architecture == "amd64" and
                       .config.Labels["org.opencontainers.image.title"] == $title and
                       .config.Labels["org.opencontainers.image.source"] == $source and
                       .config.Labels["org.opencontainers.image.revision"] == $revision and
                       .config.Labels["org.opencontainers.image.version"] == $version' \
                      <<< "$config" > /dev/null

            - name: Publish immutable and moving preview tags
              id: publish
              env:
                  ARTIFACT_DIRECTORY: ${{ runner.temp }}/pr-preview-artifact
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GHCR_USERNAME: ${{ github.actor }}
                  GITHUB_TOKEN: ${{ github.token }}
                  IMAGE: ${{ needs.resolve.outputs.image }}
                  IMMUTABLE_REFERENCE: ${{ needs.resolve.outputs.immutable_reference }}
                  IMMUTABLE_TAG: ${{ needs.resolve.outputs.immutable_tag }}
                  MOVING_REFERENCE: ${{ needs.resolve.outputs.moving_reference }}
                  PR_BASE_REF: ${{ needs.resolve.outputs.base_ref }}
                  PR_BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
                  PR_HEAD_REPOSITORY: ${{ needs.resolve.outputs.head_repository }}
                  PR_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
                  PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
                  REPOSITORY: ${{ needs.resolve.outputs.repository }}
                  TESTED_SHA: ${{ needs.resolve.outputs.tested_sha }}
              shell: bash
              run: |
                  set -Eeuo pipefail
                  auth_directory="$RUNNER_TEMP/pr-preview-auth"
                  auth_file="$auth_directory/auth.json"
                  inspect_error="$RUNNER_TEMP/pr-preview-inspect-error"
                  oci_archive="$ARTIFACT_DIRECTORY/preview-image.tar"
                  install -d -m 0700 "$auth_directory"

                  bun trusted/scripts/pr-preview.ts revalidate
                  printf '%s' "$GHCR_TOKEN" | skopeo login \
                      --authfile "$auth_file" \
                      --password-stdin \
                      --username "$GHCR_USERNAME" \
                      ghcr.io

                  set +e
                  immutable_digest="$(
                      skopeo inspect --authfile "$auth_file" --format '{{.Digest}}' \
                          "docker://$IMMUTABLE_REFERENCE" 2> "$inspect_error"
                  )"
                  inspect_status=$?
                  set -e

                  if (( inspect_status == 0 )); then
                      [[ "$immutable_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
                          echo '::error::Existing immutable preview tag has no valid digest.'
                          exit 1
                      }
                      existing_config="$(
                          skopeo inspect --authfile "$auth_file" --config \
                              "docker://$IMMUTABLE_REFERENCE"
                      )"
                      jq --exit-status \
                          --arg source "https://github.com/$REPOSITORY" \
                          --arg title 'RentnerProxy PR Preview' \
                          --arg revision "$TESTED_SHA" \
                          --arg version "$IMMUTABLE_TAG" \
                          '.os == "linux" and
                           .architecture == "amd64" and
                           .config.Labels["org.opencontainers.image.title"] == $title and
                           .config.Labels["org.opencontainers.image.source"] == $source and
                           .config.Labels["org.opencontainers.image.revision"] == $revision and
                           .config.Labels["org.opencontainers.image.version"] == $version' \
                          <<< "$existing_config" > /dev/null || {
                              echo '::error::Immutable preview tag collision detected.'
                              exit 1
                          }
                      echo 'Immutable preview tag already exists; preserving its digest.'
                  elif grep --extended-regexp --ignore-case --quiet \
                      'manifest unknown|name unknown|not found' "$inspect_error"; then
                      skopeo copy --preserve-digests \
                          --authfile "$auth_file" \
                          "oci-archive:$oci_archive" \
                          "docker://$IMMUTABLE_REFERENCE"
                      immutable_digest="$(
                          skopeo inspect --authfile "$auth_file" --format '{{.Digest}}' \
                              "docker://$IMMUTABLE_REFERENCE"
                      )"
                  else
                      echo '::error::Could not inspect the immutable preview tag.'
                      sed 's/^/skopeo: /' "$inspect_error"
                      exit 1
                  fi

                  [[ "$immutable_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
                      echo '::error::GHCR returned no valid immutable preview digest.'
                      exit 1
                  }

                  bun trusted/scripts/pr-preview.ts revalidate
                  skopeo copy --preserve-digests \
                      --authfile "$auth_file" \
                      "docker://$IMMUTABLE_REFERENCE" \
                      "docker://$MOVING_REFERENCE"
                  moving_digest="$(
                      skopeo inspect --authfile "$auth_file" --format '{{.Digest}}' \
                          "docker://$MOVING_REFERENCE"
                  )"
                  if [[ "$moving_digest" != "$immutable_digest" ]]; then
                      echo '::error::Moving and immutable preview tags have different digests.'
                      exit 1
                  fi
                  bun trusted/scripts/pr-preview.ts revalidate
                  printf 'digest=%s\n' "$immutable_digest" >> "$GITHUB_OUTPUT"

            - name: Remove registry credentials
              if: always()
              shell: bash
              run: |
                  auth_file="$RUNNER_TEMP/pr-preview-auth/auth.json"
                  if [[ -f "$auth_file" ]]; then
                      skopeo logout --authfile "$auth_file" ghcr.io || true
                      rm -f "$auth_file"
                  fi

    comment:
        name: PR Preview / Update PR comment
        needs:
            - resolve
            - publish
        runs-on: ubuntu-latest
        timeout-minutes: 10
        concurrency:
            group: pr-preview-comment-${{ needs.resolve.outputs.pr_number }}
            cancel-in-progress: false
        permissions:
            actions: read
            checks: read
            contents: read
            pull-requests: write
        steps:
            - name: Check out trusted preview automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: trusted
                  persist-credentials: false
                  ref: ${{ github.workflow_sha }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Revalidate PR and update marker comment
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
                  PR_BASE_REF: ${{ needs.resolve.outputs.base_ref }}
                  PR_BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
                  PR_HEAD_REPOSITORY: ${{ needs.resolve.outputs.head_repository }}
                  PR_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
                  PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
                  REPOSITORY: ${{ needs.resolve.outputs.repository }}
                  TESTED_SHA: ${{ needs.resolve.outputs.tested_sha }}
              run: bun trusted/scripts/pr-preview.ts comment
