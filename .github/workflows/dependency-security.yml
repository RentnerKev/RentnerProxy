name: Deployed Dependency Security

on:
    pull_request:
    push:
        branches: [main]
    schedule:
        - cron: '17 4 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: dependency-security-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    locked-source:
        name: Own dependency audit
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Check out source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.3
            - name: Audit complete locked Cargo graph
              env:
                  AUTOMATION_DIRECTORY: .
                  SOURCE_DIRECTORY: .
                  REPORT_DIRECTORY: ${{ runner.temp }}/dependency-source-report
              run: REVISION="$(git rev-parse HEAD)" bash .github/scripts/security/audit-cargo.sh
            - name: Audit complete locked Bun graph
              if: ${{ !cancelled() }}
              env:
                  AUTOMATION_DIRECTORY: .
                  SOURCE_DIRECTORY: .
                  REPORT_DIRECTORY: ${{ runner.temp }}/dependency-source-report
              run: bash .github/scripts/security/audit-bun.sh
            - name: Store exact-source advisory evidence
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  if-no-files-found: error
                  name: source-dependency-advisory-evidence
                  path: ${{ runner.temp }}/dependency-source-report
                  retention-days: 30

    production-candidate:
        name: Production image dependency audit
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Check out source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.3
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Build isolated production OCI candidate
              run: |
                  docker buildx build --file docker/production/Dockerfile --platform linux/amd64 \
                      --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
                      --provenance=mode=max --sbom=true \
                      --output "type=oci,dest=$RUNNER_TEMP/candidate-image.tar" .
            - name: Install image inspection tools
              run: bash .github/scripts/security/install-dependency-tools.sh
            - name: Gate own image dependencies
              env:
                  AUTOMATION_DIRECTORY: .
                  IMAGE_SOURCE: oci-archive:${{ runner.temp }}/candidate-image.tar
                  REPORT_DIRECTORY: ${{ runner.temp }}/dependency-image-report
              run: REVISION="$(git rev-parse HEAD)" bash .github/scripts/security/scan-image.sh
            - name: Store exact-candidate assessment
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  if-no-files-found: error
                  name: production-advisory-evidence
                  path: ${{ runner.temp }}/dependency-image-report
                  retention-days: 30

    deployed-dev:
        name: Deployed dev dependency audit
        # PRs assess their own locked source and OCI candidate. Published dev
        # is independently monitored even when its revision differs from main.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Check out trusted automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.3
            - name: Install image inspection tools
              run: bash .github/scripts/security/install-dependency-tools.sh
            - name: Resolve dev once and audit its immutable digest
              env:
                  AUTOMATION_DIRECTORY: .
                  REPORT_DIRECTORY: ${{ runner.temp }}/deployed-dev-report
              run: bash .github/scripts/security/rescan-dev-image.sh
            - name: Store deployed-dev assessment evidence
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  if-no-files-found: error
                  name: deployed-dev-advisory-evidence
                  path: ${{ runner.temp }}/deployed-dev-report
                  retention-days: 30
