name: Publish assessed OCI image

on:
    workflow_call:
        inputs:
            revision:
                required: true
                type: string
            image:
                required: true
                type: string
            image_tags:
                required: true
                type: string
            archive_sha256:
                required: true
                type: string
            digest:
                required: true
                type: string
            accept_known_dev_advisories:
                required: false
                type: boolean
                default: false
permissions: {}

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        steps:
            - name: Check out trusted publisher automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: automation
                  ref: ${{ github.workflow_sha }}

            - name: Download candidate from this exact run
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: assessed-candidate-${{ github.run_id }}
                  path: ${{ runner.temp }}/candidate

            - name: Verify candidate archive checksum
              env:
                  EXPECTED_SHA256: ${{ inputs.archive_sha256 }}
              run: |
                  [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
                  printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/candidate/candidate-image.tar" | sha256sum --check --strict

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.2

            - name: Install pinned vulnerability tools
              run: bash automation/.github/scripts/security/install-dependency-tools.sh

            - name: Independently reassess candidate with trusted automation
              id: scan
              env:
                  AUTOMATION_DIRECTORY: automation
                  IMAGE_SOURCE: oci-archive:${{ runner.temp }}/candidate/candidate-image.tar
                  REPORT_DIRECTORY: ${{ runner.temp }}/dependency-publish-report
                  REVISION: ${{ inputs.revision }}
                  ACCEPT_KNOWN_DEV_ADVISORIES: ${{ inputs.accept_known_dev_advisories }}
                  DEV_ASSESSMENT_STAGE: publish
                  # actionlint 1.7.12 predates these documented GitHub.com job fields.
                  # Decode dynamically; the policy still validates their exact values.
                  DEV_JOB_WORKFLOW_REF: ${{ fromJSON(toJSON(job)).workflow_ref }}
                  DEV_JOB_WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
                  IMAGE: ${{ inputs.image }}
                  IMAGE_TAGS: ${{ inputs.image_tags }}
              run: bash automation/.github/scripts/security/scan-image.sh

            - name: Verify assessed OCI identity
              env:
                  EXPECTED_DIGEST: ${{ inputs.digest }}
                  ASSESSED_DIGEST: ${{ steps.scan.outputs.digest }}
              run: '[[ "$ASSESSED_DIGEST" == "$EXPECTED_DIGEST" ]]'

            - name: Publish the exact assessed OCI index
              env:
                  AUTOMATION_DIRECTORY: automation
                  ASSESSED_REPORT: ${{ runner.temp }}/dependency-publish-report/assessment.json
                  IDENTITY_REPORT: ${{ runner.temp }}/dependency-publish-report/identity.json
                  ARCHIVE: ${{ runner.temp }}/candidate/candidate-image.tar
                  EXPECTED_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
                  EXPECTED_DIGEST: ${{ steps.scan.outputs.digest }}
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GHCR_USERNAME: ${{ github.actor }}
                  IMAGE: ${{ inputs.image }}
                  IMAGE_TAGS: ${{ inputs.image_tags }}
                  ACCEPT_KNOWN_DEV_ADVISORIES: ${{ inputs.accept_known_dev_advisories }}
                  DEV_ASSESSMENT_STAGE: publish
                  DEV_JOB_WORKFLOW_REF: ${{ fromJSON(toJSON(job)).workflow_ref }}
                  DEV_JOB_WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
              run: bash automation/.github/scripts/security/publish-image.sh

            - name: Store publication assessment evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  if-no-files-found: error
                  name: dependency-publish-evidence-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/dependency-publish-report
                  retention-days: 30
