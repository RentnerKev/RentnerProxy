name: RentnerProxy Release Pipeline

on:
    workflow_call:
        inputs:
            channel:
                description: Release channel derived from the tag (alpha, beta or stable)
                required: true
                type: string
            prerelease:
                description: Whether GitHub marks the release as a pre-release
                required: true
                type: boolean
            published_at:
                description: GitHub release publication timestamp
                required: true
                type: string
            release_id:
                description: GitHub release database identifier
                required: true
                type: number
            release_tag:
                description: Authoritative GitHub release tag
                required: true
                type: string

permissions: {}

env:
    BUN_VERSION: 1.4.2

jobs:
    prepare:
        name: Prepare release
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            issues: read
        outputs:
            channel_tag: ${{ steps.release.outputs.channel_tag }}
            changelog_filename: ${{ steps.release.outputs.changelog_filename }}
            image: ${{ steps.release.outputs.image }}
            revision: ${{ steps.release.outputs.revision }}
        steps:
            - name: Check out trusted release automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: automation
                  ref: ${{ github.workflow_sha }}

            - name: Validate release event
              env:
                  RELEASE_CHANNEL: ${{ inputs.channel }}
                  RELEASE_ID: ${{ inputs.release_id }}
                  RELEASE_PRERELEASE: ${{ inputs.prerelease }}
                  RELEASE_PUBLISHED_AT: ${{ inputs.published_at }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: bash automation/.github/scripts/release/validate-release-event.sh

            - name: Verify authoritative release identity
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_ID: ${{ inputs.release_id }}
                  RELEASE_PRERELEASE: ${{ inputs.prerelease }}
                  RELEASE_PUBLISHED_AT: ${{ inputs.published_at }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: bash automation/.github/scripts/release/verify-release-identity.sh

            - name: Check out exact release tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  fetch-tags: true
                  persist-credentials: false
                  path: source
                  ref: refs/tags/${{ inputs.release_tag }}

            - name: Verify release source and banner
              id: release
              env:
                  RELEASE_CHANNEL: ${{ inputs.channel }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: bash automation/.github/scripts/release/prepare-release-source.sh

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Generate issue-based release notes
              env:
                  CHANGELOG_FILENAME: ${{ steps.release.outputs.changelog_filename }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_CHANNEL: ${{ inputs.channel }}
                  RELEASE_ID: ${{ inputs.release_id }}
                  RELEASE_IMAGE: ${{ steps.release.outputs.image }}
                  RELEASE_PRERELEASE: ${{ inputs.prerelease }}
                  RELEASE_PUBLISHED_AT: ${{ inputs.published_at }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: bash automation/.github/scripts/release/prepare-release-notes.sh

            - name: Store prepared release assets
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  if-no-files-found: error
                  name: rentnerproxy-${{ inputs.channel }}-release-${{ github.run_id }}
                  overwrite: true
                  path: ${{ runner.temp }}/rentnerproxy-release
                  retention-days: 30

    build:
        name: Build and assess image
        needs:
            - prepare
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        outputs:
            digest: ${{ steps.scan.outputs.digest }}
            archive_sha256: ${{ steps.archive.outputs.sha256 }}
        steps:
            - name: Check out trusted release automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: automation
                  ref: ${{ github.workflow_sha }}

            - name: Check out exact release tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  fetch-tags: true
                  persist-credentials: false
                  path: source
                  ref: refs/tags/${{ inputs.release_tag }}

            - name: Verify exact release commit
              env:
                  EXPECTED_REVISION: ${{ needs.prepare.outputs.revision }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: bash automation/.github/scripts/release/verify-release-commit.sh

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Generate image metadata
              id: metadata
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  flavor: latest=false
                  images: ${{ needs.prepare.outputs.image }}
                  labels: |
                      org.opencontainers.image.title=RentnerProxy
                      org.opencontainers.image.description=Modern self-hosted reverse proxy manager powered by Caddy.
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.url=https://github.com/${{ github.repository }}
                      org.opencontainers.image.version=${{ inputs.release_tag }}
                      org.opencontainers.image.revision=${{ needs.prepare.outputs.revision }}
                      org.opencontainers.image.created=${{ inputs.published_at }}
                      org.opencontainers.image.licenses=MIT
                  tags: |
                      type=raw,value=${{ needs.prepare.outputs.channel_tag }}
                      type=raw,value=${{ inputs.release_tag }}

            - name: Build image as isolated OCI data
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  cache-from: type=gha,scope=release-${{ inputs.channel }}
                  cache-to: type=gha,mode=max,scope=release-${{ inputs.channel }}
                  build-args: RENTNERPROXY_BUILD_VERSION=${{ inputs.release_tag }}
                  context: source
                  file: source/docker/production/Dockerfile
                  labels: ${{ steps.metadata.outputs.labels }}
                  platforms: linux/amd64
                  provenance: mode=max
                  push: false
                  outputs: type=oci,dest=${{ runner.temp }}/candidate-image.tar
                  sbom: true

            - name: Set up Bun for advisory policy
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.2

            - name: Audit locked source graphs
              env:
                  AUTOMATION_DIRECTORY: automation
                  SOURCE_DIRECTORY: source
                  REPORT_DIRECTORY: ${{ runner.temp }}/dependency-source-report
                  REVISION: ${{ needs.prepare.outputs.revision }}
              run: |
                  bash automation/.github/scripts/security/audit-cargo.sh
                  cd source
                  bun audit --audit-level=moderate

            - name: Install pinned vulnerability tools
              run: bash automation/.github/scripts/security/install-dependency-tools.sh

            - name: Assess immutable candidate before publication
              id: scan
              env:
                  AUTOMATION_DIRECTORY: automation
                  IMAGE_SOURCE: oci-archive:${{ runner.temp }}/candidate-image.tar
                  REPORT_DIRECTORY: ${{ runner.temp }}/dependency-image-report
                  REVISION: ${{ needs.prepare.outputs.revision }}
              run: bash automation/.github/scripts/security/scan-image.sh

            - name: Bind archive checksum
              id: archive
              run: printf 'sha256=%s\n' "$(sha256sum "$RUNNER_TEMP/candidate-image.tar" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

            - name: Store assessed OCI candidate
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  compression-level: 0
                  if-no-files-found: error
                  overwrite: true
                  name: assessed-candidate-${{ github.run_id }}
                  path: ${{ runner.temp }}/candidate-image.tar
                  retention-days: 2

            - name: Store dependency evidence
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  if-no-files-found: error
                  name: dependency-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      ${{ runner.temp }}/dependency-source-report
                      ${{ runner.temp }}/dependency-image-report
                  retention-days: 30

    publish-image:
        needs:
            - prepare
            - build
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/publish-assessed-image.yml
        with:
            revision: ${{ needs.prepare.outputs.revision }}
            image: ${{ needs.prepare.outputs.image }}
            archive_sha256: ${{ needs.build.outputs.archive_sha256 }}
            digest: ${{ needs.build.outputs.digest }}
            image_tags: |
                ${{ inputs.release_tag }}
                ${{ needs.prepare.outputs.channel_tag }}

    publish:
        name: Publish release notes
        needs:
            - prepare
            - publish-image
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - name: Check out trusted release automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: automation
                  ref: ${{ github.workflow_sha }}

            - name: Download prepared release assets
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: rentnerproxy-${{ inputs.channel }}-release-${{ github.run_id }}
                  path: ${{ runner.temp }}/rentnerproxy-release

            - name: Validate prepared release assets
              env:
                  CHANGELOG_FILENAME: ${{ needs.prepare.outputs.changelog_filename }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: bash automation/.github/scripts/release/validate-release-assets.sh

            - name: Upload assets and update release body
              env:
                  CHANGELOG_FILENAME: ${{ needs.prepare.outputs.changelog_filename }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_ID: ${{ inputs.release_id }}
                  RELEASE_PRERELEASE: ${{ inputs.prerelease }}
                  RELEASE_PUBLISHED_AT: ${{ inputs.published_at }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: bash automation/.github/scripts/release/publish-release-notes.sh
