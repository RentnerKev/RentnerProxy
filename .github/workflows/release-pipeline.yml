name: RentnerProxy Release Pipeline

on:
    workflow_call:
        inputs:
            channel:
                description: Release channel (dev or stable)
                required: true
                type: string
            prerelease:
                description: Whether GitHub marks the release as a pre-release
                required: true
                type: boolean
            published_at:
                description: GitHub release publication timestamp
                required: true
                type: string
            release_id:
                description: GitHub release database identifier
                required: true
                type: number
            release_tag:
                description: Authoritative GitHub release tag
                required: true
                type: string

permissions: {}

env:
    BUN_VERSION: 1.4.0

jobs:
    prepare:
        name: Prepare release
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            issues: read
        outputs:
            channel_tag: ${{ steps.release.outputs.channel_tag }}
            changelog_filename: ${{ steps.release.outputs.changelog_filename }}
            image: ${{ steps.release.outputs.image }}
            revision: ${{ steps.release.outputs.revision }}
        steps:
            - name: Validate release event
              env:
                  RELEASE_CHANNEL: ${{ inputs.channel }}
                  RELEASE_ID: ${{ inputs.release_id }}
                  RELEASE_PRERELEASE: ${{ inputs.prerelease }}
                  RELEASE_PUBLISHED_AT: ${{ inputs.published_at }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: |
                  set -Eeuo pipefail

                  semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
                  if (( ${#RELEASE_TAG} > 128 )) || [[ ! "$RELEASE_TAG" =~ $semver_pattern ]]; then
                      echo "::error::Invalid release tag. Expected Docker-compatible SemVer such as v1.2.3 or v1.2.3-rc.1."
                      exit 1
                  fi

                  prerelease_part="${BASH_REMATCH[5]:-}"
                  if [[ -n "$prerelease_part" ]]; then
                      IFS='.' read -ra identifiers <<< "$prerelease_part"
                      for identifier in "${identifiers[@]}"; do
                          if [[ "$identifier" =~ ^[0-9]+$ && "${#identifier}" -gt 1 && "$identifier" == 0* ]]; then
                              echo "::error::Invalid release tag. Numeric prerelease identifiers cannot have leading zeroes."
                              exit 1
                          fi
                      done
                  fi

                  case "$RELEASE_CHANNEL:$RELEASE_PRERELEASE" in
                      dev:true)
                          [[ -n "$prerelease_part" ]] || {
                              echo "::error::A development pre-release requires a SemVer prerelease tag."
                              exit 1
                          }
                          ;;
                      stable:false)
                          [[ -z "$prerelease_part" ]] || {
                              echo "::error::A stable release cannot use a SemVer prerelease tag."
                              exit 1
                          }
                          ;;
                      *)
                          echo "::error::Release channel does not match the GitHub prerelease state."
                          exit 1
                          ;;
                  esac

                  [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || {
                      echo "::error::No valid GitHub release metadata was provided."
                      exit 1
                  }
                  [[ -n "$RELEASE_PUBLISHED_AT" ]] || {
                      echo "::error::The GitHub release publication timestamp is missing."
                      exit 1
                  }

            - name: Verify authoritative release identity
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_ID: ${{ inputs.release_id }}
                  RELEASE_PRERELEASE: ${{ inputs.prerelease }}
                  RELEASE_PUBLISHED_AT: ${{ inputs.published_at }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: |
                  set -Eeuo pipefail
                  release_state="$(
                      gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                          --jq '[.id, .tag_name, .draft, .prerelease, .published_at] | @tsv'
                  )" || {
                      echo "::error::The release from the published event is no longer available."
                      exit 1
                  }
                  IFS=$'\t' read -r actual_id actual_tag is_draft is_prerelease published_at <<< "$release_state"
                  if [[ "$actual_id" != "$RELEASE_ID" || "$actual_tag" != "$RELEASE_TAG" || "$is_draft" != 'false' || "$is_prerelease" != "$RELEASE_PRERELEASE" || "$published_at" != "$RELEASE_PUBLISHED_AT" ]]; then
                      echo "::error::GitHub release metadata does not match the published event."
                      exit 1
                  fi

            - name: Check out trusted release automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: automation
                  ref: ${{ github.workflow_sha }}

            - name: Check out exact release tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  fetch-tags: true
                  persist-credentials: false
                  path: source
                  ref: refs/tags/${{ inputs.release_tag }}

            - name: Verify release source and banner
              id: release
              env:
                  RELEASE_CHANNEL: ${{ inputs.channel }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: |
                  set -Eeuo pipefail

                  tag_ref="refs/tags/$RELEASE_TAG"
                  git -C source show-ref --verify --quiet "$tag_ref" || {
                      echo "::error::Release tag $RELEASE_TAG does not exist in the checkout."
                      exit 1
                  }
                  revision="$(git -C source rev-parse HEAD)"
                  tag_revision="$(git -C source rev-list -n 1 "$tag_ref")"
                  [[ "$revision" == "$tag_revision" ]] || {
                      echo "::error::Checked-out HEAD does not match the authoritative release tag."
                      exit 1
                  }

                  dockerfile_relative='docker/production/Dockerfile'
                  dockerignore_relative='docker/production/Dockerfile.dockerignore'
                  [[ -s "source/$dockerfile_relative" ]] || {
                      echo "::error::Release Dockerfile is missing or empty: $dockerfile_relative"
                      exit 1
                  }
                  [[ -s "source/$dockerignore_relative" ]] || {
                      echo "::error::Release Docker ignore file is missing or empty: $dockerignore_relative"
                      exit 1
                  }
                  if ! grep -Fq '**/.env' "source/$dockerignore_relative" ||
                      ! grep -Fq '**/*.key' "source/$dockerignore_relative"; then
                      echo "::error::Release Docker context does not exclude environment and key files."
                      exit 1
                  fi

                  repository="${GITHUB_REPOSITORY,,}"
                  [[ "$repository" =~ ^[a-z0-9][a-z0-9_.-]*/[a-z0-9][a-z0-9_.-]*$ ]] || {
                      echo "::error::The repository name cannot be normalized into a safe GHCR image name."
                      exit 1
                  }
                  image="ghcr.io/$repository"

                  case "$RELEASE_CHANNEL" in
                      dev)
                          banner_relative='.github/assets/release-banners/dev-release-banner.png'
                          channel_tag=dev
                          ;;
                      stable)
                          banner_relative='.github/assets/release-banners/new-release-banner.png'
                          channel_tag=latest
                          ;;
                      *)
                          echo "::error::Unsupported release channel."
                          exit 1
                          ;;
                  esac

                  banner_path="source/$banner_relative"
                  [[ -s "$banner_path" ]] || {
                      echo "::error::Required release banner is missing or empty: $banner_relative"
                      exit 1
                  }
                  png_signature="$(od -An -t x1 -N8 "$banner_path" | tr -d ' \n')"
                  [[ "$png_signature" == '89504e470d0a1a0a' ]] || {
                      echo "::error::Required release banner is not a valid PNG: $banner_relative"
                      exit 1
                  }

                  output_directory="$RUNNER_TEMP/rentnerproxy-release"
                  mkdir -p "$output_directory"
                  cp "$banner_path" "$output_directory/release-banner.png"
                  changelog_filename="RentnerProxy-$RELEASE_TAG-CHANGELOG.md"

                  {
                      printf 'channel_tag=%s\n' "$channel_tag"
                      printf 'changelog_filename=%s\n' "$changelog_filename"
                      printf 'image=%s\n' "$image"
                      printf 'revision=%s\n' "$revision"
                  } >> "$GITHUB_OUTPUT"

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Generate issue-based release notes
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_CHANNEL: ${{ inputs.channel }}
                  RELEASE_ID: ${{ inputs.release_id }}
                  RELEASE_IMAGE: ${{ steps.release.outputs.image }}
                  RELEASE_PRERELEASE: ${{ inputs.prerelease }}
                  RELEASE_PUBLISHED_AT: ${{ inputs.published_at }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: |
                  set -Eeuo pipefail
                  bun automation/scripts/generate-release-notes.ts \
                      --config automation/.github/release-notes.json \
                      --output-dir "$RUNNER_TEMP/rentnerproxy-release"

                  [[ -s "$RUNNER_TEMP/rentnerproxy-release/release-body.md" ]] || {
                      echo "::error::Release notes generator did not create a release body."
                      exit 1
                  }
                  [[ -s "$RUNNER_TEMP/rentnerproxy-release/${{ steps.release.outputs.changelog_filename }}" ]] || {
                      echo "::error::Release notes generator did not create a changelog asset."
                      exit 1
                  }

            - name: Store prepared release assets
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  if-no-files-found: error
                  name: rentnerproxy-${{ inputs.channel }}-release-${{ github.run_id }}
                  overwrite: true
                  path: ${{ runner.temp }}/rentnerproxy-release
                  retention-days: 30

    build:
        name: Build and publish image
        needs:
            - prepare
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write
        outputs:
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - name: Check out exact release tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  fetch-tags: true
                  persist-credentials: false
                  path: source
                  ref: refs/tags/${{ inputs.release_tag }}

            - name: Verify exact release commit
              env:
                  EXPECTED_REVISION: ${{ needs.prepare.outputs.revision }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: |
                  set -Eeuo pipefail
                  revision="$(git -C source rev-parse HEAD)"
                  tag_revision="$(git -C source rev-list -n 1 "refs/tags/$RELEASE_TAG")"
                  if [[ "$revision" != "$EXPECTED_REVISION" || "$tag_revision" != "$EXPECTED_REVISION" ]]; then
                      echo "::error::Build checkout does not match the prepared release commit."
                      exit 1
                  fi

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  password: ${{ secrets.GITHUB_TOKEN }}
                  registry: ghcr.io
                  username: ${{ github.actor }}

            - name: Generate image metadata
              id: metadata
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  flavor: latest=false
                  images: ${{ needs.prepare.outputs.image }}
                  labels: |
                      org.opencontainers.image.title=RentnerProxy
                      org.opencontainers.image.description=Modern, open-source and self-hosted reverse proxy manager built with TypeScript, TanStack Start, Rust and NGINX.
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.url=https://github.com/${{ github.repository }}
                      org.opencontainers.image.version=${{ inputs.release_tag }}
                      org.opencontainers.image.revision=${{ needs.prepare.outputs.revision }}
                      org.opencontainers.image.created=${{ inputs.published_at }}
                      org.opencontainers.image.licenses=MIT
                  tags: |
                      type=raw,value=${{ needs.prepare.outputs.channel_tag }}
                      type=raw,value=${{ inputs.release_tag }}

            - name: Build and publish image
              id: build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  cache-from: type=gha,scope=release-${{ inputs.channel }}
                  cache-to: type=gha,mode=max,scope=release-${{ inputs.channel }}
                  context: source
                  file: source/docker/production/Dockerfile
                  labels: ${{ steps.metadata.outputs.labels }}
                  platforms: linux/amd64
                  provenance: mode=max
                  push: true
                  sbom: true
                  tags: ${{ steps.metadata.outputs.tags }}

            - name: Verify published image tags
              env:
                  CHANNEL_TAG: ${{ needs.prepare.outputs.channel_tag }}
                  EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
                  IMAGE: ${{ needs.prepare.outputs.image }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: |
                  set -Eeuo pipefail

                  [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
                      echo "::error::Docker build returned no valid image digest."
                      exit 1
                  }

                  verify_reference() {
                      local reference=$1
                      local actual_digest=''
                      for _ in {1..6}; do
                          actual_digest="$(
                              docker buildx imagetools inspect "$reference" \
                                  --format '{{.Manifest.Digest}}' 2>/dev/null || true
                          )"
                          if [[ "$actual_digest" == "$EXPECTED_DIGEST" ]]; then
                              return 0
                          fi
                          sleep 5
                      done
                      echo "::error::Published image $reference did not resolve to the expected digest."
                      return 1
                  }

                  verify_reference "$IMAGE:$RELEASE_TAG"
                  verify_reference "$IMAGE:$CHANNEL_TAG"

    publish:
        name: Publish release notes
        needs:
            - prepare
            - build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - name: Download prepared release assets
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: rentnerproxy-${{ inputs.channel }}-release-${{ github.run_id }}
                  path: ${{ runner.temp }}/rentnerproxy-release

            - name: Validate prepared release assets
              env:
                  CHANGELOG_FILENAME: ${{ needs.prepare.outputs.changelog_filename }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: |
                  set -Eeuo pipefail
                  artifact_directory="$RUNNER_TEMP/rentnerproxy-release"
                  expected_changelog="RentnerProxy-$RELEASE_TAG-CHANGELOG.md"
                  [[ "$CHANGELOG_FILENAME" == "$expected_changelog" ]] || {
                      echo "::error::Prepared changelog filename does not match the release tag."
                      exit 1
                  }
                  [[ -s "$artifact_directory/release-body.md" ]] || {
                      echo "::error::Prepared release body is missing or empty."
                      exit 1
                  }
                  [[ -s "$artifact_directory/$CHANGELOG_FILENAME" ]] || {
                      echo "::error::Prepared changelog is missing or empty."
                      exit 1
                  }
                  [[ -s "$artifact_directory/release-banner.png" ]] || {
                      echo "::error::Prepared release banner is missing or empty."
                      exit 1
                  }
                  png_signature="$(
                      od -An -t x1 -N8 "$artifact_directory/release-banner.png" | tr -d ' \n'
                  )"
                  [[ "$png_signature" == '89504e470d0a1a0a' ]] || {
                      echo "::error::Prepared release banner is not a valid PNG."
                      exit 1
                  }

            - name: Upload assets and update release body
              env:
                  CHANGELOG_FILENAME: ${{ needs.prepare.outputs.changelog_filename }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_ID: ${{ inputs.release_id }}
                  RELEASE_PRERELEASE: ${{ inputs.prerelease }}
                  RELEASE_PUBLISHED_AT: ${{ inputs.published_at }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: |
                  set -Eeuo pipefail
                  artifact_directory="$RUNNER_TEMP/rentnerproxy-release"

                  release_state="$(
                      gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                          --jq '[.id, .tag_name, .draft, .prerelease, .published_at] | @tsv'
                  )" || {
                      echo "::error::The release from the published event is no longer available."
                      exit 1
                  }
                  IFS=$'\t' read -r actual_id actual_tag is_draft is_prerelease published_at <<< "$release_state"
                  if [[ "$actual_id" != "$RELEASE_ID" || "$actual_tag" != "$RELEASE_TAG" || "$is_draft" != 'false' || "$is_prerelease" != "$RELEASE_PRERELEASE" || "$published_at" != "$RELEASE_PUBLISHED_AT" ]]; then
                      echo "::error::GitHub release metadata changed while the release workflow was running."
                      exit 1
                  fi

                  gh release upload "$RELEASE_TAG" \
                      "$artifact_directory/release-banner.png" \
                      "$artifact_directory/$CHANGELOG_FILENAME" \
                      --clobber \
                      --repo "$GITHUB_REPOSITORY" || {
                      echo "::error::Uploading GitHub release assets failed."
                      exit 1
                  }

                  gh release edit "$RELEASE_TAG" \
                      --notes-file "$artifact_directory/release-body.md" \
                      --repo "$GITHUB_REPOSITORY" || {
                      echo "::error::Updating the GitHub release body failed."
                      exit 1
                  }
