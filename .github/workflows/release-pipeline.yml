name: RentnerProxy Release Pipeline

on:
    workflow_call:
        inputs:
            channel:
                description: Release channel derived from the tag (alpha, beta or stable)
                required: true
                type: string
            prerelease:
                description: Whether GitHub marks the release as a pre-release
                required: true
                type: boolean
            published_at:
                description: GitHub release publication timestamp
                required: true
                type: string
            release_id:
                description: GitHub release database identifier
                required: true
                type: number
            release_tag:
                description: Authoritative GitHub release tag
                required: true
                type: string

permissions: {}

concurrency:
    group: signed-package-repository
    cancel-in-progress: false

env:
    BUN_VERSION: 1.4.4

jobs:
    prepare:
        name: Prepare release
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            issues: read
        outputs:
            channel_tag: ${{ steps.release.outputs.channel_tag }}
            changelog_filename: ${{ steps.release.outputs.changelog_filename }}
            image: ${{ steps.release.outputs.image }}
            revision: ${{ steps.release.outputs.revision }}
        steps:
            - name: Check out trusted release automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: automation
                  ref: ${{ github.workflow_sha }}

            - name: Validate release event
              env:
                  RELEASE_CHANNEL: ${{ inputs.channel }}
                  RELEASE_ID: ${{ inputs.release_id }}
                  RELEASE_PRERELEASE: ${{ inputs.prerelease }}
                  RELEASE_PUBLISHED_AT: ${{ inputs.published_at }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: bash automation/.github/scripts/release/validate-release-event.sh

            - name: Verify authoritative release identity
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_ID: ${{ inputs.release_id }}
                  RELEASE_PRERELEASE: ${{ inputs.prerelease }}
                  RELEASE_PUBLISHED_AT: ${{ inputs.published_at }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: bash automation/.github/scripts/release/verify-release-identity.sh

            - name: Check out exact release tag
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  fetch-tags: true
                  persist-credentials: false
                  path: source
                  ref: refs/tags/${{ inputs.release_tag }}

            - name: Verify release source and banner
              id: release
              env:
                  RELEASE_CHANNEL: ${{ inputs.channel }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: bash automation/.github/scripts/release/prepare-release-source.sh

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Generate issue-based release notes
              env:
                  CHANGELOG_FILENAME: ${{ steps.release.outputs.changelog_filename }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_CHANNEL: ${{ inputs.channel }}
                  RELEASE_ID: ${{ inputs.release_id }}
                  RELEASE_IMAGE: ${{ steps.release.outputs.image }}
                  RELEASE_PRERELEASE: ${{ inputs.prerelease }}
                  RELEASE_PUBLISHED_AT: ${{ inputs.published_at }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: bash automation/.github/scripts/release/prepare-release-notes.sh

            - name: Store prepared release assets
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  if-no-files-found: error
                  name: rentnerproxy-${{ inputs.channel }}-release-${{ github.run_id }}
                  overwrite: true
                  path: ${{ runner.temp }}/rentnerproxy-release
                  retention-days: 30

    build:
        needs: prepare
        permissions:
            contents: read
        uses: ./.github/workflows/build-assessed-image.yml
        with:
            revision: ${{ needs.prepare.outputs.revision }}
            image: ${{ needs.prepare.outputs.image }}
            version: ${{ inputs.release_tag }}
            release_tag: ${{ inputs.release_tag }}
            published_at: ${{ inputs.published_at }}
            title: RentnerProxy
            description: Modern self-hosted reverse proxy manager powered by Caddy.
            cache_scope: release-${{ inputs.channel }}

    distribution:
        needs: [prepare, build]
        permissions:
            contents: read
        uses: ./.github/workflows/build-distribution.yml
        with:
            revision: ${{ needs.prepare.outputs.revision }}
            version: ${{ inputs.release_tag }}
            digest: ${{ needs.build.outputs.digest }}
            archive_sha256: ${{ needs.build.outputs.archive_sha256 }}
            evidence_sha256: ${{ needs.build.outputs.evidence_sha256 }}

    sign-distribution:
        needs: [prepare, build, distribution]
        permissions:
            contents: read
        uses: ./.github/workflows/sign-distribution.yml
        with:
            revision: ${{ needs.prepare.outputs.revision }}
            version: ${{ inputs.release_tag }}
            digest: ${{ needs.build.outputs.digest }}
            bundle_sha256: ${{ needs.distribution.outputs.bundle_sha256 }}
            release_id: ${{ inputs.release_id }}
            published_at: ${{ inputs.published_at }}
            prerelease: ${{ inputs.prerelease }}

    publish-image:
        needs:
            - prepare
            - build
            - sign-distribution
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/publish-assessed-image.yml
        with:
            revision: ${{ needs.prepare.outputs.revision }}
            image: ${{ needs.prepare.outputs.image }}
            archive_sha256: ${{ needs.build.outputs.archive_sha256 }}
            evidence_sha256: ${{ needs.build.outputs.evidence_sha256 }}
            version: ${{ inputs.release_tag }}
            digest: ${{ needs.build.outputs.digest }}
            image_tags: |
                ${{ inputs.release_tag }}
                ${{ needs.prepare.outputs.channel_tag }}

    publish-distribution:
        needs: [prepare, build, sign-distribution, publish-image]
        permissions:
            contents: write
            pages: write
            id-token: write
        uses: ./.github/workflows/publish-distribution.yml
        with:
            revision: ${{ needs.prepare.outputs.revision }}
            version: ${{ inputs.release_tag }}
            digest: ${{ needs.build.outputs.digest }}
            signed_bundle_sha256: ${{ needs.sign-distribution.outputs.signed_bundle_sha256 }}
            fingerprint: ${{ needs.sign-distribution.outputs.fingerprint }}
            repository_url: ${{ needs.sign-distribution.outputs.repository_url }}
            release_id: ${{ inputs.release_id }}
            published_at: ${{ inputs.published_at }}
            channel: ${{ inputs.channel }}
            prerelease: ${{ inputs.prerelease }}

    publish:
        name: Publish release notes
        needs:
            - prepare
            - build
            - publish-image
            - publish-distribution
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            actions: read
            contents: write
        steps:
            - name: Check out trusted release automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: automation
                  ref: ${{ github.workflow_sha }}

            - name: Check out exact release policy source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: source
                  ref: ${{ needs.prepare.outputs.revision }}

            - name: Download prepared release assets
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: rentnerproxy-${{ inputs.channel }}-release-${{ github.run_id }}
                  path: ${{ runner.temp }}/rentnerproxy-release

            - name: Validate prepared release assets
              env:
                  CHANGELOG_FILENAME: ${{ needs.prepare.outputs.changelog_filename }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: bash automation/.github/scripts/release/validate-release-assets.sh

            - name: Upload assets and update release body
              env:
                  CHANGELOG_FILENAME: ${{ needs.prepare.outputs.changelog_filename }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_ID: ${{ inputs.release_id }}
                  RELEASE_PRERELEASE: ${{ inputs.prerelease }}
                  RELEASE_PUBLISHED_AT: ${{ inputs.published_at }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: bash automation/.github/scripts/release/publish-release-notes.sh

            - name: Set up Bun for release readiness
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Publish readiness after verified image and release assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_CHANNEL: ${{ inputs.channel }}
                  RELEASE_DIGEST: ${{ needs.build.outputs.digest }}
                  RELEASE_ID: ${{ inputs.release_id }}
                  RELEASE_IMAGE: ${{ needs.prepare.outputs.image }}
                  RELEASE_PLATFORMS: ${{ needs.publish-image.outputs.platforms }}
                  RELEASE_PRERELEASE: ${{ inputs.prerelease }}
                  RELEASE_PUBLISHED_AT: ${{ inputs.published_at }}
                  RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
                  RELEASE_TAG: ${{ inputs.release_tag }}
              shell: bash
              run: bash automation/.github/scripts/release/publish-release-readiness.sh
