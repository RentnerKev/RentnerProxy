name: PR Preview Build

on:
    workflow_run:
        workflows:
            - PR Title
        types:
            - completed

permissions: {}

env:
    BUN_VERSION: 1.4.2
    GATE_TIMEOUT_SECONDS: 1500
    POLL_INTERVAL_SECONDS: 20
    PREVIEW_PLATFORM: linux/amd64

jobs:
    verify:
        name: PR Preview / Verify checks
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            actions: read
            checks: read
            contents: read
            pull-requests: read
        outputs:
            base_ref: ${{ steps.gate.outputs.base_ref }}
            base_sha: ${{ steps.gate.outputs.base_sha }}
            head_repository: ${{ steps.gate.outputs.head_repository }}
            head_sha: ${{ steps.gate.outputs.head_sha }}
            immutable_tag: ${{ steps.gate.outputs.immutable_tag }}
            lifecycle: ${{ steps.gate.outputs.lifecycle }}
            pr_number: ${{ steps.gate.outputs.pr_number }}
            repository: ${{ steps.gate.outputs.repository }}
            tested_sha: ${{ steps.gate.outputs.tested_sha }}
            trigger_run_id: ${{ steps.gate.outputs.trigger_run_id }}
        steps:
            - name: Check out trusted preview automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: trusted
                  persist-credentials: false
                  ref: ${{ github.workflow_sha }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Verify PR trigger and SHA-proof artifact envelope
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
              run: bun trusted/.github/scripts/deploy/pr-preview.ts trigger-preflight

            - name: Download exact tested merge SHA
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  github-token: ${{ github.token }}
                  name: pr-preview-source
                  path: ${{ runner.temp }}/pr-preview-source
                  repository: ${{ github.repository }}
                  run-id: ${{ github.event.workflow_run.id }}

            - name: Resolve PR and wait for trusted required checks
              id: gate
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  SOURCE_PROOF_DIRECTORY: ${{ runner.temp }}/pr-preview-source
                  SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
              run: bun trusted/.github/scripts/deploy/pr-preview.ts gate

    build:
        name: PR Preview / Build image
        needs:
            - verify
        runs-on: ubuntu-latest
        timeout-minutes: 45
        concurrency:
            group: pr-preview-build-${{ needs.verify.outputs.pr_number }}
            cancel-in-progress: true
        permissions:
            contents: read
        steps:
            - name: Check out trusted preview build automation
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: trusted
                  ref: ${{ github.workflow_sha }}

            - name: Check out exact tested pull request source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  path: source
                  ref: ${{ needs.verify.outputs.tested_sha }}

            - name: Verify exact build source
              env:
                  EXPECTED_TESTED_SHA: ${{ needs.verify.outputs.tested_sha }}
              shell: bash
              run: bash trusted/.github/scripts/deploy/verify-preview-source.sh

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Build untrusted preview image as OCI data
              env:
                  IMMUTABLE_TAG: ${{ needs.verify.outputs.immutable_tag }}
                  PR_NUMBER: ${{ needs.verify.outputs.pr_number }}
                  REPOSITORY: ${{ needs.verify.outputs.repository }}
                  TESTED_SHA: ${{ needs.verify.outputs.tested_sha }}
              shell: bash
              run: bash trusted/.github/scripts/deploy/build-preview-image.sh

            - name: Create minimal build metadata
              env:
                  BASE_SHA: ${{ needs.verify.outputs.base_sha }}
                  HEAD_REPOSITORY: ${{ needs.verify.outputs.head_repository }}
                  HEAD_SHA: ${{ needs.verify.outputs.head_sha }}
                  PR_NUMBER: ${{ needs.verify.outputs.pr_number }}
                  REPOSITORY: ${{ needs.verify.outputs.repository }}
                  TESTED_SHA: ${{ needs.verify.outputs.tested_sha }}
                  TRIGGER_RUN_ID: ${{ needs.verify.outputs.trigger_run_id }}
              shell: bash
              run: bash trusted/.github/scripts/deploy/create-preview-metadata.sh

            - name: Upload OCI preview artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  compression-level: 0
                  if-no-files-found: error
                  name: pr-preview-image
                  overwrite: true
                  path: |
                      ${{ runner.temp }}/pr-preview-artifact/preview-image.tar
                      ${{ runner.temp }}/pr-preview-artifact/metadata.json
                  retention-days: 2
