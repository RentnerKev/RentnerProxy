name: CodeQL

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        - cron: '23 4 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: codeql-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    analyze:
        name: CodeQL (${{ matrix.display-name }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: javascript-typescript
                      display-name: JavaScript / TypeScript
                    - language: rust
                      display-name: Rust
                    - language: actions
                      display-name: GitHub Actions
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Rust
              if: matrix.language == 'rust'
              run: |
                  rustup toolchain install 1.99.1 --profile minimal
                  rustup override set 1.99.1

            - name: Initialize CodeQL
              uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none

            - name: Analyze
              uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
              with:
                  category: /language:${{ matrix.language }}
