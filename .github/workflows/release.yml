name: RentnerProxy Release

on:
    release:
        types:
            - published

permissions: {}

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    classify:
        name: Select release channel
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            channel: ${{ steps.channel.outputs.channel }}
        steps:
            - name: Read version suffix
              id: channel
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              shell: bash
              run: |
                  set -Eeuo pipefail
                  case "${RELEASE_TAG#*-}" in
                      alpha|alpha.*) channel=alpha ;;
                      beta|beta.*) channel=beta ;;
                      *) channel=stable ;;
                  esac
                  printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"

    release:
        name: Release
        needs: classify
        permissions:
            contents: write
            issues: read
            packages: write
        uses: ./.github/workflows/release-pipeline.yml
        with:
            channel: ${{ needs.classify.outputs.channel }}
            prerelease: ${{ github.event.release.prerelease }}
            published_at: ${{ github.event.release.published_at }}
            release_id: ${{ github.event.release.id }}
            release_tag: ${{ github.event.release.tag_name }}
