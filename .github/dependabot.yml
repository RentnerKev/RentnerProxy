version: 2

updates:
    - package-ecosystem: 'bun'
      directory: '/'
      schedule:
          interval: 'cron'
          cronjob: '0 3 * * *'
          timezone: 'Europe/Berlin'
      commit-message:
          prefix: 'chore'
          include: 'scope'
      open-pull-requests-limit: 10
      groups:
          bun-minor-and-patch:
              applies-to: 'version-updates'
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'cargo'
      directory: '/controller'
      schedule:
          interval: 'cron'
          cronjob: '0 3 * * *'
          timezone: 'Europe/Berlin'
      commit-message:
          prefix: 'chore'
          include: 'scope'
      open-pull-requests-limit: 10
      groups:
          cargo-minor-and-patch:
              applies-to: 'version-updates'
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'docker'
      directories:
          - '/docker/production'
          - '/docker/proxy-runtime'
          - '/docker/web'
      schedule:
          interval: 'cron'
          cronjob: '0 3 * * *'
          timezone: 'Europe/Berlin'
      commit-message:
          prefix: 'chore'
          include: 'scope'
      open-pull-requests-limit: 10
      groups:
          docker-by-dependency:
              applies-to: 'version-updates'
              group-by: 'dependency-name'

    - package-ecosystem: 'docker-compose'
      directory: '/'
      schedule:
          interval: 'cron'
          cronjob: '0 3 * * *'
          timezone: 'Europe/Berlin'
      commit-message:
          prefix: 'chore'
          include: 'scope'
      open-pull-requests-limit: 10
      ignore:
          # Do not recursively update RentnerProxy's own release channel.
          - dependency-name: 'rentnerkev/rentnerproxy'

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'cron'
          cronjob: '0 3 * * *'
          timezone: 'Europe/Berlin'
      commit-message:
          prefix: 'chore'
          include: 'scope'
      open-pull-requests-limit: 10
      groups:
          github-actions-minor-and-patch:
              applies-to: 'version-updates'
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'
