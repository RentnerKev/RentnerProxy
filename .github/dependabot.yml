version: 2

# Bun updates are intentionally omitted while Dependabot cannot parse the
# Bun 1.4 text lockfile format used by this repository. Re-enable the bun
# ecosystem once GitHub's updater supports this lockfile format.
updates:
    - package-ecosystem: cargo
      directory: /controller
      schedule:
          interval: weekly
          day: monday
      labels:
          - dependencies
          - cargo
      assignees:
          - RentnerKev
      commit-message:
          prefix: chore
          include: scope
      open-pull-requests-limit: 5
      groups:
          minor-and-patch:
              applies-to: version-updates
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      labels:
          - dependencies
          - github-actions
      assignees:
          - RentnerKev
      commit-message:
          prefix: ci
          include: scope
      open-pull-requests-limit: 5
      groups:
          minor-and-patch:
              applies-to: version-updates
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch
