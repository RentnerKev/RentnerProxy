version: 2

updates:
    - package-ecosystem: cargo
      directory: /controller
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      groups:
          minor-and-patch:
              applies-to: version-updates
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      groups:
          minor-and-patch:
              applies-to: version-updates
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch
